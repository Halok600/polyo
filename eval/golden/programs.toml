# Golden group: whole programs, harnesses and cross-function composition.
# Two conventions matter here:
#   1. Entry selection: `main`, `Main`, test harnesses and the `if __name__ == "__main__"` block
#      call the solution on tiny constant inputs; they are NOT the answer. The answer is the
#      solution function's cost as a function of its own input size. (The original bug report was
#      exactly this: a C++ two-sum wrapped in class Solution plus a main() came out O(2^n).)
#   2. A program that reads its input has ONE size variable: every size derived from that input
#      (a scalar n read from stdin, the length of a list built from it) is the same `n`.

[[case]]
id = "program_two_sum_with_main_harness"
title = "Brute-force Two Sum inside class Solution with a main() test driver"
tags = ["harness", "entry-selection", "nested-loop", "early-exit", "leetcode", "regression"]
time_class = "O(n^2)"
space_class = "O(1)"
time_expr = "O(n^2)"
space_expr = "O(1)"
rationale = "REGRESSION for the original bug report. The nested loops are O(n^2); main() only calls twoSum on a 4-element literal, which must not turn the answer into O(1) or anything else. The result is a constant-size pair."

[case.sources]
python = '''
class Solution:
    def twoSum(self, nums, target):
        n = len(nums)
        for i in range(n):
            for j in range(i + 1, n):
                if nums[i] + nums[j] == target:
                    return [i, j]
        return []


if __name__ == "__main__":
    print(Solution().twoSum([2, 7, 11, 15], 9))
'''
cpp = '''
#include <iostream>
#include <vector>
using namespace std;

class Solution {
public:
    vector<int> twoSum(vector<int>& nums, int target) {
        int n = nums.size();
        for (int i = 0; i < n; i++) {
            for (int j = i + 1; j < n; j++) {
                if (nums[i] + nums[j] == target) return {i, j};
            }
        }
        return {};
    }
};

int main() {
    Solution sol;
    vector<int> nums = {2, 7, 11, 15};
    vector<int> result = sol.twoSum(nums, 9);
    cout << result[0] << " " << result[1] << endl;
    return 0;
}
'''
java = '''
