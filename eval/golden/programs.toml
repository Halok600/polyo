[[case]]
id = "interprocedural_helper_in_loop"
title = "A linear helper called once per element"
tags = ["interprocedural", "nested-cost", "allocation"]
time_class = "O(n^2)"
space_class = "O(n)"
time_expr = "O(n^2)"
space_expr = "O(n)"
rationale = "TRAP: the outer function has one visible loop, but each iteration calls count_smaller, a full O(n) scan. Composing costs across the call gives n * n. The ranks list is O(n)."

[case.sources]
python = '''
def count_smaller(nums, i):
    count = 0
    for x in nums:
        if x < nums[i]:
            count += 1
    return count


def rank_all(nums):
    ranks = []
    for i in range(len(nums)):
        ranks.append(count_smaller(nums, i))
    return ranks
'''
cpp = '''
int countSmaller(vector<int>& nums, int i) {
    int count = 0;
    for (int x : nums) {
        if (x < nums[i]) count++;
    }
    return count;
}

vector<int> rankAll(vector<int>& nums) {
    vector<int> ranks;
    for (int i = 0; i < nums.size(); i++) {
        ranks.push_back(countSmaller(nums, i));
    }
    return ranks;
}
'''
java = '''
class Solution {
    private int countSmaller(int[] nums, int i) {
        int count = 0;
        for (int x : nums) {
            if (x < nums[i]) count++;
        }
        return count;
    }

    public List<Integer> rankAll(int[] nums) {
        List<Integer> ranks = new ArrayList<>();
        for (int i = 0; i < nums.length; i++) {
            ranks.add(countSmaller(nums, i));
        }
        return ranks;
    }
}
'''
javascript = '''
function countSmaller(nums, i) {
  let count = 0;
  for (const x of nums) {
    if (x < nums[i]) count++;
  }
  return count;
}

function rankAll(nums) {
  const ranks = [];
  for (let i = 0; i < nums.length; i++) {
    ranks.push(countSmaller(nums, i));
  }
  return ranks;
}
'''
go = '''
func countSmaller(nums []int, i int) int {
    count := 0
    for _, x := range nums {
        if x < nums[i] {
            count++
        }
    }
    return count
}

func rankAll(nums []int) []int {
    ranks := []int{}
    for i := 0; i < len(nums); i++ {
        ranks = append(ranks, countSmaller(nums, i))
    }
    return ranks
}
'''

[[case]]
id = "interprocedural_binary_search_helper"
title = "A binary-search helper called for every query"
tags = ["interprocedural", "multi-variable", "binary-search"]
time_class = "O(n log n)"
space_class = "O(1)"
time_expr = "O(m * log n)"
space_expr = "O(1)"
rationale = "n = len(sorted_nums) (first parameter), m = len(queries). Each of the m queries runs a binary search over n sorted values: m log n. The legacy class collapses both to n."

[case.sources]
python = '''
def contains(sorted_nums, x):
    lo = 0
    hi = len(sorted_nums) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if sorted_nums[mid] == x:
            return True
        if sorted_nums[mid] < x:
            lo = mid + 1
        else:
            hi = mid - 1
    return False


def count_present(sorted_nums, queries):
    count = 0
    for q in queries:
        if contains(sorted_nums, q):
            count += 1
    return count
'''
cpp = '''
bool contains(vector<int>& sortedNums, int x) {
    int lo = 0;
    int hi = sortedNums.size() - 1;
    while (lo <= hi) {
        int mid = lo + (hi - lo) / 2;
        if (sortedNums[mid] == x) return true;
        if (sortedNums[mid] < x) {
            lo = mid + 1;
        } else {
            hi = mid - 1;
        }
    }
    return false;
}

int countPresent(vector<int>& sortedNums, vector<int>& queries) {
    int count = 0;
    for (int q : queries) {
        if (contains(sortedNums, q)) count++;
    }
    return count;
}
'''
java = '''
class Solution {
    private boolean contains(int[] sortedNums, int x) {
        int lo = 0;
        int hi = sortedNums.length - 1;
        while (lo <= hi) {
            int mid = lo + (hi - lo) / 2;
            if (sortedNums[mid] == x) return true;
            if (sortedNums[mid] < x) {
                lo = mid + 1;
            } else {
                hi = mid - 1;
            }
        }
        return false;
    }

    public int countPresent(int[] sortedNums, int[] queries) {
        int count = 0;
        for (int q : queries) {
            if (contains(sortedNums, q)) count++;
        }
        return count;
    }
}
'''
javascript = '''
function contains(sortedNums, x) {
  let lo = 0;
  let hi = sortedNums.length - 1;
  while (lo <= hi) {
    const mid = Math.floor((lo + hi) / 2);
    if (sortedNums[mid] === x) return true;
    if (sortedNums[mid] < x) {
      lo = mid + 1;
    } else {
      hi = mid - 1;
    }
  }
  return false;
}

function countPresent(sortedNums, queries) {
  let count = 0;
  for (const q of queries) {
    if (contains(sortedNums, q)) count++;
  }
  return count;
}
'''
go = '''
func contains(sortedNums []int, x int) bool {
    lo := 0
    hi := len(sortedNums) - 1
    for lo <= hi {
        mid := lo + (hi-lo)/2
        if sortedNums[mid] == x {
            return true
        }
        if sortedNums[mid] < x {
            lo = mid + 1
        } else {
            hi = mid - 1
        }
    }
    return false
}

func countPresent(sortedNums []int, queries []int) int {
    count := 0
    for _, q := range queries {
        if contains(sortedNums, q) {
            count++
        }
    }
    return count
}
'''

