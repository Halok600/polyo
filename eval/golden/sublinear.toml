[[case]]
id = "log_binary_search_recursive"
title = "Recursive binary search through a wrapper"
tags = ["logarithmic", "binary-search", "recursion", "interprocedural"]
time_class = "O(log n)"
space_class = "O(log n)"
time_expr = "O(log n)"
space_expr = "O(log n)"
rationale = "Each call halves the index range [lo, hi] and makes one recursive call, so depth and time are log n. The wrapper passes hi = len-1, tying the range to the array length."

[case.sources]
python = '''
def bsearch(nums, target, lo, hi):
    if lo > hi:
        return -1
    mid = (lo + hi) // 2
    if nums[mid] == target:
        return mid
    if nums[mid] < target:
        return bsearch(nums, target, mid + 1, hi)
    return bsearch(nums, target, lo, mid - 1)


def search(nums, target):
    return bsearch(nums, target, 0, len(nums) - 1)
'''
cpp = '''
int bsearch(vector<int>& nums, int target, int lo, int hi) {
    if (lo > hi) return -1;
    int mid = lo + (hi - lo) / 2;
    if (nums[mid] == target) return mid;
    if (nums[mid] < target) return bsearch(nums, target, mid + 1, hi);
    return bsearch(nums, target, lo, mid - 1);
}

int search(vector<int>& nums, int target) {
    return bsearch(nums, target, 0, nums.size() - 1);
}
'''
java = '''
class Solution {
    public int search(int[] nums, int target) {
        return bsearch(nums, target, 0, nums.length - 1);
    }

    private int bsearch(int[] nums, int target, int lo, int hi) {
        if (lo > hi) return -1;
        int mid = lo + (hi - lo) / 2;
        if (nums[mid] == target) return mid;
        if (nums[mid] < target) return bsearch(nums, target, mid + 1, hi);
        return bsearch(nums, target, lo, mid - 1);
    }
}
'''
javascript = '''
function bsearch(nums, target, lo, hi) {
  if (lo > hi) return -1;
  const mid = Math.floor((lo + hi) / 2);
  if (nums[mid] === target) return mid;
  if (nums[mid] < target) return bsearch(nums, target, mid + 1, hi);
  return bsearch(nums, target, lo, mid - 1);
}

function search(nums, target) {
  return bsearch(nums, target, 0, nums.length - 1);
}
'''
go = '''
func bsearch(nums []int, target int, lo int, hi int) int {
    if lo > hi {
        return -1
    }
    mid := lo + (hi-lo)/2
    if nums[mid] == target {
        return mid
    }
    if nums[mid] < target {
        return bsearch(nums, target, mid+1, hi)
    }
    return bsearch(nums, target, lo, mid-1)
}

func search(nums []int, target int) int {
    return bsearch(nums, target, 0, len(nums)-1)
}
'''
c = '''
int bsearch(int* nums, int target, int lo, int hi) {
    if (lo > hi) return -1;
    int mid = lo + (hi - lo) / 2;
    if (nums[mid] == target) return mid;
    if (nums[mid] < target) return bsearch(nums, target, mid + 1, hi);
    return bsearch(nums, target, lo, mid - 1);
}

int search(int* nums, int n, int target) {
    return bsearch(nums, target, 0, n - 1);
}
'''

