[[case]]
id = "log_power_by_squaring_iter"
title = "Fast exponentiation, iterative"
tags = ["logarithmic", "halving", "bit-shift", "integer-parameter"]
time_class = "O(log n)"
space_class = "O(1)"
time_expr = "O(log n)"
space_expr = "O(1)"
rationale = "The exponent is shifted right every iteration, so log2(exp) iterations; n is the exponent's value."

[case.sources]
python = '''
def power(base, exp):
    result = 1
    while exp > 0:
        if exp & 1:
            result *= base
        base *= base
        exp >>= 1
    return result
'''
cpp = '''
long long power(long long base, int exp) {
    long long result = 1;
    while (exp > 0) {
        if (exp & 1) result *= base;
        base *= base;
        exp >>= 1;
    }
    return result;
}
'''
java = '''
class Solution {
    public long power(long base, int exp) {
        long result = 1;
        while (exp > 0) {
            if ((exp & 1) == 1) result *= base;
            base *= base;
            exp >>= 1;
        }
        return result;
    }
}
'''
javascript = '''
function power(base, exp) {
  let result = 1;
  while (exp > 0) {
    if (exp & 1) result *= base;
    base *= base;
    exp >>= 1;
  }
  return result;
}
'''
go = '''
func power(base int, exp int) int {
    result := 1
    for exp > 0 {
        if exp&1 == 1 {
            result *= base
        }
        base *= base
        exp >>= 1
    }
    return result
}
'''
c = '''
long long power(long long base, int exp) {
    long long result = 1;
    while (exp > 0) {
        if (exp & 1) result *= base;
        base *= base;
        exp >>= 1;
    }
    return result;
}
'''

[[case]]
id = "log_power_by_squaring_recursive"
title = "Fast exponentiation, recursive"
tags = ["logarithmic", "recursion", "halving", "integer-parameter"]
time_class = "O(log n)"
space_class = "O(log n)"
time_expr = "O(log n)"
space_expr = "O(log n)"
rationale = "T(n) = T(n/2) + O(1) gives log n time; the recursion depth is log n, so the stack is log n."

[case.sources]
python = '''
def power(x, n):
    if n == 0:
        return 1
    half = power(x, n // 2)
    if n % 2 == 0:
        return half * half
    return half * half * x
'''
cpp = '''
long long power(long long x, int n) {
    if (n == 0) return 1;
    long long half = power(x, n / 2);
    if (n % 2 == 0) return half * half;
    return half * half * x;
}
'''
java = '''
class Solution {
    public long power(long x, int n) {
        if (n == 0) return 1;
        long half = power(x, n / 2);
        if (n % 2 == 0) return half * half;
        return half * half * x;
    }
}
'''
javascript = '''
function power(x, n) {
  if (n === 0) return 1;
  const half = power(x, Math.floor(n / 2));
  if (n % 2 === 0) return half * half;
  return half * half * x;
}
'''
go = '''
func power(x int, n int) int {
    if n == 0 {
        return 1
    }
    half := power(x, n/2)
    if n%2 == 0 {
        return half * half
    }
    return half * half * x
}
'''
c = '''
long long power(long long x, int n) {
    if (n == 0) return 1;
    long long half = power(x, n / 2);
    if (n % 2 == 0) return half * half;
    return half * half * x;
}
'''

