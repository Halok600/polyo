[[case]]
id = "sqrt_integer_root_scan"
title = "Floor square root by incrementing"
tags = ["sqrt", "squared-condition", "integer-parameter"]
time_class = "O(n)"
space_class = "O(1)"
time_expr = "O(sqrt n)"
space_expr = "O(1)"
rationale = "(r+1)^2 <= n holds for r up to sqrt(n), so the scan makes about sqrt(n) steps."

[case.sources]
python = '''
def floor_sqrt(n):
    r = 0
    while (r + 1) * (r + 1) <= n:
        r += 1
    return r
'''
cpp = '''
int floorSqrt(int n) {
    int r = 0;
    while ((long long)(r + 1) * (r + 1) <= n) {
        r++;
    }
    return r;
}
'''
java = '''
class Solution {
    public int floorSqrt(int n) {
        int r = 0;
        while ((long) (r + 1) * (r + 1) <= n) {
            r++;
        }
        return r;
    }
}
'''
javascript = '''
function floorSqrt(n) {
  let r = 0;
  while ((r + 1) * (r + 1) <= n) {
    r++;
  }
  return r;
}
'''
go = '''
func floorSqrt(n int) int {
