title = "Count divisors in pairs up to sqrt(n)"
tags = ["sqrt", "squared-condition", "integer-parameter"]
time_class = "O(n)"
space_class = "O(1)"
time_expr = "O(sqrt n)"
space_expr = "O(1)"
rationale = "Divisors come in pairs (i, n/i), so scanning i up to sqrt(n) suffices."

[case.sources]
python = '''
def count_divisors(n):
    count = 0
    i = 1
    while i * i <= n:
        if n % i == 0:
            count += 1
            if i != n // i:
                count += 1
        i += 1
    return count
'''
cpp = '''
