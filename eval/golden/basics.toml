title = "Insertion sort"
tags = ["nested-loop", "sorting", "while"]
time_class = "O(n^2)"
space_class = "O(1)"
time_expr = "O(n^2)"
space_expr = "O(1)"
rationale = "Worst case (reverse-sorted input): the inner while shifts i elements for each i, which is n(n-1)/2 shifts. The inner loop is bounded by j decreasing to 0."

[case.sources]
python = '''
def insertion_sort(nums):
    for i in range(1, len(nums)):
        key = nums[i]
        j = i - 1
        while j >= 0 and nums[j] > key:
            nums[j + 1] = nums[j]
            j -= 1
        nums[j + 1] = key
    return nums
'''
cpp = '''
void insertionSort(vector<int>& nums) {
    for (int i = 1; i < nums.size(); i++) {
        int key = nums[i];
        int j = i - 1;
        while (j >= 0 && nums[j] > key) {
            nums[j + 1] = nums[j];
            j--;
        }
        nums[j + 1] = key;
    }
}
'''
java = '''
