[[case]]
id = "quartic_four_loops"
title = "Count zero-sum quadruples"
tags = ["nested-loop", "lossy-projection"]
time_class = "O(n^3)"
space_class = "O(1)"
time_expr = "O(n^4)"
space_expr = "O(1)"
rationale = "Four nested full-range loops are Theta(n^4). The legacy taxonomy tops out at O(n^3), so the class column is the lossy projection and the expression column carries the truth."

[case.sources]
python = '''
def count_quadruples(nums):
    n = len(nums)
    count = 0
    for a in range(n):
        for b in range(n):
            for c in range(n):
                for d in range(n):
                    if nums[a] + nums[b] + nums[c] + nums[d] == 0:
                        count += 1
    return count
'''
cpp = '''
int countQuadruples(vector<int>& nums) {
    int n = nums.size();
    int count = 0;
    for (int a = 0; a < n; a++) {
        for (int b = 0; b < n; b++) {
            for (int c = 0; c < n; c++) {
                for (int d = 0; d < n; d++) {
                    if (nums[a] + nums[b] + nums[c] + nums[d] == 0) count++;
                }
            }
        }
    }
    return count;
}
'''
