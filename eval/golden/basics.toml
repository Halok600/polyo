[[case]]
id = "quad_two_sum_bruteforce"
title = "Two Sum by checking every pair"
tags = ["nested-loop", "early-exit", "leetcode"]
time_class = "O(n^2)"
space_class = "O(1)"
time_expr = "O(n^2)"
space_expr = "O(1)"
rationale = "The canonical report: the early return only helps when a pair exists; the worst case (no pair) is n(n-1)/2 checks. Output is a constant-size pair."

[case.sources]
python = '''
def twoSum(nums, target):
    n = len(nums)
    for i in range(n):
        for j in range(i + 1, n):
            if nums[i] + nums[j] == target:
                return [i, j]
    return []
'''
cpp = '''
class Solution {
public:
    vector<int> twoSum(vector<int>& nums, int target) {
        int n = nums.size();
        for (int i = 0; i < n; i++) {
            for (int j = i + 1; j < n; j++) {
                if (nums[i] + nums[j] == target) return {i, j};
            }
        }
        return {};
    }
};
'''
java = '''
class Solution {
    public int[] twoSum(int[] nums, int target) {
