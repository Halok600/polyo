[[case]]
id = "cubic_floyd_warshall"
title = "Floyd-Warshall all-pairs shortest paths, in place"
tags = ["nested-loop", "triple", "grid"]
time_class = "O(n^3)"
space_class = "O(1)"
time_expr = "O(n^3)"
space_expr = "O(1)"
rationale = "Three nested loops over the vertex count; the distance matrix is updated in place, so there is no auxiliary allocation."

[case.sources]
python = '''
def floyd_warshall(dist):
    n = len(dist)
    for k in range(n):
        for i in range(n):
            for j in range(n):
                if dist[i][k] + dist[k][j] < dist[i][j]:
                    dist[i][j] = dist[i][k] + dist[k][j]
    return dist
'''
