[[case]]
id = "const_four_neighbors"
title = "Count open cells among the four neighbours"
tags = ["constant", "literal-iterable", "grid"]
time_class = "O(1)"
space_class = "O(1)"
time_expr = "O(1)"
space_expr = "O(1)"
rationale = "The loop walks a literal list of four direction offsets; the grid is only indexed, never traversed."

[case.sources]
python = '''
def count_open_neighbors(grid, r, c):
    dirs = [(1, 0), (-1, 0), (0, 1), (0, -1)]
    total = 0
    for dr, dc in dirs:
        nr, nc = r + dr, c + dc
        if 0 <= nr < len(grid) and 0 <= nc < len(grid[0]) and grid[nr][nc] == 0:
            total += 1
    return total
'''
cpp = '''
int countOpenNeighbors(vector<vector<int>>& grid, int r, int c) {
    int dr[4] = {1, -1, 0, 0};
    int dc[4] = {0, 0, 1, -1};
    int total = 0;
    for (int d = 0; d < 4; d++) {
        int nr = r + dr[d];
        int nc = c + dc[d];
        if (nr >= 0 && nr < grid.size() && nc >= 0 && nc < grid[0].size() && grid[nr][nc] == 0) {
            total++;
        }
    }
    return total;
}
'''
java = '''
class Solution {
    public int countOpenNeighbors(int[][] grid, int r, int c) {
        int[] dr = {1, -1, 0, 0};
        int[] dc = {0, 0, 1, -1};
        int total = 0;
        for (int d = 0; d < 4; d++) {
            int nr = r + dr[d];
            int nc = c + dc[d];
            if (nr >= 0 && nr < grid.length && nc >= 0 && nc < grid[0].length && grid[nr][nc] == 0) {
                total++;
            }
        }
        return total;
    }
}
'''
javascript = '''
function countOpenNeighbors(grid, r, c) {
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  let total = 0;
  for (const [dr, dc] of dirs) {
    const nr = r + dr;
    const nc = c + dc;
    if (nr >= 0 && nr < grid.length && nc >= 0 && nc < grid[0].length && grid[nr][nc] === 0) {
      total++;
    }
  }
  return total;
}
'''
go = '''
func countOpenNeighbors(grid [][]int, r int, c int) int {
    dirs := [][2]int{{1, 0}, {-1, 0}, {0, 1}, {0, -1}}
    total := 0
    for _, d := range dirs {
        nr := r + d[0]
        nc := c + d[1]
        if nr >= 0 && nr < len(grid) && nc >= 0 && nc < len(grid[0]) && grid[nr][nc] == 0 {
            total++
        }
    }
    return total
}
'''

