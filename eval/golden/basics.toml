[[case]]
id = "linear_two_pointer_reverse"
title = "Reverse an array in place with two pointers"
tags = ["single-loop", "two-pointers", "while"]
time_class = "O(n)"
space_class = "O(1)"
time_expr = "O(n)"
space_expr = "O(1)"
rationale = "Each iteration moves both pointers toward each other, so there are about n/2 iterations; the swap is O(1) and in place."

[case.sources]
python = '''
def reverse(nums):
    i, j = 0, len(nums) - 1
    while i < j:
        nums[i], nums[j] = nums[j], nums[i]
        i += 1
        j -= 1
    return nums
'''
cpp = '''
void reverseInPlace(vector<int>& nums) {
    int i = 0;
    int j = nums.size() - 1;
    while (i < j) {
        int tmp = nums[i];
        nums[i] = nums[j];
        nums[j] = tmp;
        i++;
        j--;
    }
}
'''
java = '''
class Solution {
    public void reverseInPlace(int[] nums) {
        int i = 0;
        int j = nums.length - 1;
        while (i < j) {
            int tmp = nums[i];
            nums[i] = nums[j];
            nums[j] = tmp;
            i++;
            j--;
        }
    }
}
'''
javascript = '''
function reverseInPlace(nums) {
  let i = 0;
  let j = nums.length - 1;
  while (i < j) {
    const tmp = nums[i];
    nums[i] = nums[j];
    nums[j] = tmp;
    i++;
    j--;
  }
}
'''
go = '''
func reverseInPlace(nums []int) {
    i := 0
    j := len(nums) - 1
    for i < j {
        nums[i], nums[j] = nums[j], nums[i]
        i++
        j--
    }
}
'''
c = '''
void reverseInPlace(int* nums, int n) {
    int i = 0;
    int j = n - 1;
    while (i < j) {
        int tmp = nums[i];
        nums[i] = nums[j];
        nums[j] = tmp;
        i++;
        j--;
    }
}
'''

