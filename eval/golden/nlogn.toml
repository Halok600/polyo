space_expr = "O(n)"
rationale = "n iterations, each sorting an n-element copy (n log n): n^2 log n. The legacy taxonomy has no n^2 log n class, so time_class is the next class that upper-bounds it (O(n^3)); the expression is the truth. Each copy is freed, so the peak auxiliary space is one copy, O(n)."

