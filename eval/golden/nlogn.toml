[[case]]
id = "n2logn_three_sum_binary_search"
title = "3Sum by fixing two elements and binary-searching the third"
tags = ["sorting", "binary-search", "nested-loop", "early-exit", "lossy-projection"]
time_class = "O(n^3)"
space_class = "O(n)"
time_expr = "O(n^2 log n)"
space_expr = "O(n)"
rationale = "Sorting is n log n; n^2/2 pairs each cost a log n binary search: n^2 log n. time_class is the lossy legacy round-up; the sorted copy is O(n)."

[case.sources]
python = '''
def has_three_sum(nums, target):
    ordered = sorted(nums)
    n = len(ordered)
    for i in range(n):
        for j in range(i + 1, n):
            want = target - ordered[i] - ordered[j]
            lo, hi = j + 1, n - 1
            while lo <= hi:
                mid = (lo + hi) // 2
                if ordered[mid] == want:
                    return True
                if ordered[mid] < want:
                    lo = mid + 1
                else:
                    hi = mid - 1
    return False
'''
cpp = '''
bool hasThreeSum(vector<int>& nums, int target) {
    vector<int> ordered = nums;
    sort(ordered.begin(), ordered.end());
