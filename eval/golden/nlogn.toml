# Golden group: n log n and n^2 log n.
# Includes the two classic traps where multiplying loop bounds is WRONG or needs a closed-form
# sum: the harmonic sieve (sum of n/i) and a doubling outer loop around a linear inner loop.
# Space convention for sorts: most cases sort a COPY, so the O(n) copy dominates in every
# language and the label does not depend on the library sort's own auxiliary space.

[[case]]
id = "nlogn_sorted_unique"
title = "Sort a copy, then drop adjacent duplicates"
tags = ["sorting", "library-call", "copy"]
time_class = "O(n log n)"
space_class = "O(n)"
time_expr = "O(n log n)"
space_expr = "O(n)"
rationale = "Library sort of a copy is n log n; the dedupe pass is linear and dominated. The copy and the output are O(n)."

[case.sources]
python = '''
def sorted_unique(nums):
    ordered = sorted(nums)
    out = []
    for x in ordered:
        if not out or out[-1] != x:
            out.append(x)
    return out
'''
cpp = '''
vector<int> sortedUnique(vector<int>& nums) {
    vector<int> ordered = nums;
    sort(ordered.begin(), ordered.end());
    vector<int> out;
    for (int x : ordered) {
        if (out.empty() || out.back() != x) out.push_back(x);
    }
    return out;
}
'''
java = '''
class Solution {
    public List<Integer> sortedUnique(int[] nums) {
        int[] ordered = nums.clone();
        Arrays.sort(ordered);
        List<Integer> out = new ArrayList<>();
        for (int x : ordered) {
            if (out.isEmpty() || out.get(out.size() - 1) != x) out.add(x);
        }
        return out;
    }
}
'''
javascript = '''
function sortedUnique(nums) {
  const ordered = [...nums].sort((a, b) => a - b);
  const out = [];
  for (const x of ordered) {
    if (out.length === 0 || out[out.length - 1] !== x) out.push(x);
  }
  return out;
}
'''
go = '''
func sortedUnique(nums []int) []int {
    ordered := make([]int, len(nums))
    copy(ordered, nums)
    sort.Ints(ordered)
    out := []int{}
    for _, x := range ordered {
        if len(out) == 0 || out[len(out)-1] != x {
            out = append(out, x)
        }
    }
    return out
}
'''

