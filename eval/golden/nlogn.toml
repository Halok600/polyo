    for (int i = 0; i < n; i++) {
        for (int j = i + 1; j < n; j++) {
            int want = target - ordered[i] - ordered[j];
            int lo = j + 1;
            int hi = n - 1;
            while (lo <= hi) {
                int mid = lo + (hi - lo) / 2;
                if (ordered[mid] == want) return true;
                if (ordered[mid] < want) {
                    lo = mid + 1;
                } else {
                    hi = mid - 1;
                }
            }
        }
    }
    return false;
}
'''
