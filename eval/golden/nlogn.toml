[[case]]
id = "nlogn_merge_sort"
title = "Top-down merge sort"
tags = ["sorting", "recursion", "divide-and-conquer", "master-theorem"]
time_class = "O(n log n)"
space_class = "O(n)"
time_expr = "O(n log n)"
space_expr = "O(n)"
rationale = "T(n) = 2T(n/2) + O(n) by the master theorem (case 2) is n log n. The merge buffer / result lists make the auxiliary space O(n); recursion adds only O(log n)."

[case.sources]
python = '''
def merge_sort(nums):
    if len(nums) <= 1:
        return nums
    mid = len(nums) // 2
    left = merge_sort(nums[:mid])
    right = merge_sort(nums[mid:])
    result = []
    i = 0
    j = 0
    while i < len(left) and j < len(right):
        if left[i] <= right[j]:
            result.append(left[i])
            i += 1
        else:
            result.append(right[j])
            j += 1
    result.extend(left[i:])
    result.extend(right[j:])
    return result
'''
cpp = '''
void mergeSort(vector<int>& nums, vector<int>& tmp, int lo, int hi) {
    if (hi - lo <= 1) return;
    int mid = (lo + hi) / 2;
    mergeSort(nums, tmp, lo, mid);
    mergeSort(nums, tmp, mid, hi);
    int i = lo;
    int j = mid;
    int k = lo;
    while (i < mid && j < hi) {
        if (nums[i] <= nums[j]) {
            tmp[k++] = nums[i++];
        } else {
            tmp[k++] = nums[j++];
        }
    }
    while (i < mid) tmp[k++] = nums[i++];
    while (j < hi) tmp[k++] = nums[j++];
    for (k = lo; k < hi; k++) nums[k] = tmp[k];
}

void sortArray(vector<int>& nums) {
    vector<int> tmp(nums.size());
    mergeSort(nums, tmp, 0, nums.size());
}
'''
java = '''
class Solution {
    public void sortArray(int[] nums) {
        int[] tmp = new int[nums.length];
        mergeSort(nums, tmp, 0, nums.length);
    }

    private void mergeSort(int[] nums, int[] tmp, int lo, int hi) {
        if (hi - lo <= 1) return;
        int mid = (lo + hi) / 2;
        mergeSort(nums, tmp, lo, mid);
        mergeSort(nums, tmp, mid, hi);
        int i = lo;
        int j = mid;
        int k = lo;
        while (i < mid && j < hi) {
            if (nums[i] <= nums[j]) {
                tmp[k++] = nums[i++];
            } else {
                tmp[k++] = nums[j++];
            }
        }
        while (i < mid) tmp[k++] = nums[i++];
        while (j < hi) tmp[k++] = nums[j++];
        for (k = lo; k < hi; k++) nums[k] = tmp[k];
    }
}
'''
javascript = '''
function mergeSort(nums) {
  if (nums.length <= 1) return nums;
  const mid = Math.floor(nums.length / 2);
  const left = mergeSort(nums.slice(0, mid));
  const right = mergeSort(nums.slice(mid));
  const result = [];
  let i = 0;
  let j = 0;
  while (i < left.length && j < right.length) {
    if (left[i] <= right[j]) {
      result.push(left[i]);
      i++;
    } else {
      result.push(right[j]);
      j++;
    }
  }
  while (i < left.length) result.push(left[i++]);
  while (j < right.length) result.push(right[j++]);
  return result;
}
'''
go = '''
func mergeSort(nums []int) []int {
    if len(nums) <= 1 {
        return nums
    }
    mid := len(nums) / 2
    left := mergeSort(nums[:mid])
    right := mergeSort(nums[mid:])
    result := make([]int, 0, len(nums))
    i, j := 0, 0
    for i < len(left) && j < len(right) {
        if left[i] <= right[j] {
            result = append(result, left[i])
            i++
        } else {
            result = append(result, right[j])
            j++
        }
    }
    result = append(result, left[i:]...)
    result = append(result, right[j:]...)
    return result
}
'''
c = '''
void mergeSort(int* nums, int* tmp, int lo, int hi) {
    if (hi - lo <= 1) return;
    int mid = (lo + hi) / 2;
    mergeSort(nums, tmp, lo, mid);
    mergeSort(nums, tmp, mid, hi);
    int i = lo;
    int j = mid;
    int k = lo;
    while (i < mid && j < hi) {
        if (nums[i] <= nums[j]) {
            tmp[k++] = nums[i++];
        } else {
            tmp[k++] = nums[j++];
        }
    }
    while (i < mid) tmp[k++] = nums[i++];
    while (j < hi) tmp[k++] = nums[j++];
    for (k = lo; k < hi; k++) nums[k] = tmp[k];
}

void sortArray(int* nums, int n) {
    int* tmp = malloc(n * sizeof(int));
    mergeSort(nums, tmp, 0, n);
    free(tmp);
}
'''

[[case]]
id = "nlogn_heap_sort_with_queue"
title = "Sort by pushing everything into a heap and popping it back"
tags = ["sorting", "heap", "library-call"]
time_class = "O(n log n)"
space_class = "O(n)"
time_expr = "O(n log n)"
space_expr = "O(n)"
rationale = "n pushes and n pops at O(log n) each; the heap and the output list are O(n). Go defines the heap.Interface methods, which are O(1) helpers."

[case.sources]
python = '''
import heapq


def heap_sort(nums):
    heap = []
    for x in nums:
        heapq.heappush(heap, x)
    out = []
    while heap:
        out.append(heapq.heappop(heap))
    return out
'''
cpp = '''
vector<int> heapSort(vector<int>& nums) {
    priority_queue<int, vector<int>, greater<int>> heap;
    for (int x : nums) heap.push(x);
    vector<int> out;
    while (!heap.empty()) {
        out.push_back(heap.top());
        heap.pop();
    }
    return out;
}
'''
java = '''
class Solution {
    public List<Integer> heapSort(int[] nums) {
        PriorityQueue<Integer> heap = new PriorityQueue<>();
        for (int x : nums) heap.add(x);
        List<Integer> out = new ArrayList<>();
        while (!heap.isEmpty()) {
            out.add(heap.poll());
        }
        return out;
    }
}
'''
javascript = '''
function heapSort(nums) {
  const heap = new MinPriorityQueue();
  for (const x of nums) heap.enqueue(x);
  const out = [];
  while (!heap.isEmpty()) {
    out.push(heap.dequeue());
  }
  return out;
}
'''
go = '''
type IntHeap []int

func (h IntHeap) Len() int           { return len(h) }
func (h IntHeap) Less(i, j int) bool { return h[i] < h[j] }
func (h IntHeap) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }
func (h *IntHeap) Push(x any)        { *h = append(*h, x.(int)) }
func (h *IntHeap) Pop() any {
    old := *h
    n := len(old)
    x := old[n-1]
    *h = old[:n-1]
    return x
}

func heapSort(nums []int) []int {
    h := &IntHeap{}
    for _, x := range nums {
        heap.Push(h, x)
    }
    out := []int{}
    for h.Len() > 0 {
        out = append(out, heap.Pop(h).(int))
    }
    return out
}
'''

[[case]]
id = "nlogn_pair_sum_with_binary_search"
title = "Pair with a target sum: sort, then binary-search each complement"
tags = ["sorting", "binary-search", "nested-loop", "early-exit"]
time_class = "O(n log n)"
space_class = "O(n)"
time_expr = "O(n log n)"
space_expr = "O(n)"
rationale = "Sort is n log n; then n iterations each run a binary search over at most n elements (log n). The sorted copy is O(n)."

[case.sources]
python = '''
def has_pair_with_sum(nums, target):
    ordered = sorted(nums)
    for i in range(len(ordered)):
        want = target - ordered[i]
        lo, hi = i + 1, len(ordered) - 1
        while lo <= hi:
            mid = (lo + hi) // 2
            if ordered[mid] == want:
                return True
            if ordered[mid] < want:
                lo = mid + 1
            else:
                hi = mid - 1
    return False
'''
cpp = '''
bool hasPairWithSum(vector<int>& nums, int target) {
    vector<int> ordered = nums;
    sort(ordered.begin(), ordered.end());
    for (int i = 0; i < ordered.size(); i++) {
        int want = target - ordered[i];
        int lo = i + 1;
        int hi = ordered.size() - 1;
        while (lo <= hi) {
            int mid = lo + (hi - lo) / 2;
            if (ordered[mid] == want) return true;
            if (ordered[mid] < want) {
                lo = mid + 1;
            } else {
                hi = mid - 1;
            }
        }
    }
    return false;
}
'''
java = '''
class Solution {
    public boolean hasPairWithSum(int[] nums, int target) {
        int[] ordered = nums.clone();
        Arrays.sort(ordered);
        for (int i = 0; i < ordered.length; i++) {
            int want = target - ordered[i];
            int lo = i + 1;
            int hi = ordered.length - 1;
            while (lo <= hi) {
                int mid = lo + (hi - lo) / 2;
                if (ordered[mid] == want) return true;
                if (ordered[mid] < want) {
                    lo = mid + 1;
                } else {
                    hi = mid - 1;
                }
            }
        }
        return false;
    }
}
'''
javascript = '''
function hasPairWithSum(nums, target) {
  const ordered = [...nums].sort((a, b) => a - b);
  for (let i = 0; i < ordered.length; i++) {
    const want = target - ordered[i];
    let lo = i + 1;
    let hi = ordered.length - 1;
    while (lo <= hi) {
      const mid = Math.floor((lo + hi) / 2);
      if (ordered[mid] === want) return true;
      if (ordered[mid] < want) {
        lo = mid + 1;
      } else {
        hi = mid - 1;
      }
    }
  }
  return false;
}
'''
