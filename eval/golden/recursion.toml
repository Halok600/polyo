[[case]]
id = "rec_memo_grid_paths"
title = "Unique grid paths with a 2-D memo"
tags = ["recursion", "memoization", "multi-variable", "integer-parameter", "interprocedural", "allocation"]
time_class = "O(n^2)"
space_class = "O(n^2)"
time_expr = "O(n * m)"
space_expr = "O(n * m)"
rationale = "m*n distinct (r, c) states, each computed once and cached: m*n time. The memo table is m*n and the recursion is at most m+n deep."

[case.sources]
python = '''
def go(r, c, m, n, memo):
    if r == m - 1 or c == n - 1:
        return 1
    if memo[r][c] != -1:
        return memo[r][c]
    memo[r][c] = go(r + 1, c, m, n, memo) + go(r, c + 1, m, n, memo)
    return memo[r][c]


def unique_paths(m, n):
    memo = [[-1] * n for _ in range(m)]
    return go(0, 0, m, n, memo)
'''
cpp = '''
int go(int r, int c, int m, int n, vector<vector<int>>& memo) {
    if (r == m - 1 || c == n - 1) return 1;
    if (memo[r][c] != -1) return memo[r][c];
    memo[r][c] = go(r + 1, c, m, n, memo) + go(r, c + 1, m, n, memo);
    return memo[r][c];
}

int uniquePaths(int m, int n) {
    vector<vector<int>> memo(m, vector<int>(n, -1));
    return go(0, 0, m, n, memo);
}
'''
java = '''
class Solution {
    public int uniquePaths(int m, int n) {
        int[][] memo = new int[m][n];
        for (int[] row : memo) Arrays.fill(row, -1);
        return go(0, 0, m, n, memo);
    }

    private int go(int r, int c, int m, int n, int[][] memo) {
        if (r == m - 1 || c == n - 1) return 1;
        if (memo[r][c] != -1) return memo[r][c];
        memo[r][c] = go(r + 1, c, m, n, memo) + go(r, c + 1, m, n, memo);
        return memo[r][c];
    }
}
'''
javascript = '''
function go(r, c, m, n, memo) {
  if (r === m - 1 || c === n - 1) return 1;
  if (memo[r][c] !== -1) return memo[r][c];
  memo[r][c] = go(r + 1, c, m, n, memo) + go(r, c + 1, m, n, memo);
  return memo[r][c];
}

function uniquePaths(m, n) {
  const memo = Array.from({ length: m }, () => new Array(n).fill(-1));
  return go(0, 0, m, n, memo);
}
'''
go = '''
func walk(r int, c int, m int, n int, memo [][]int) int {
    if r == m-1 || c == n-1 {
        return 1
    }
    if memo[r][c] != -1 {
        return memo[r][c]
    }
    memo[r][c] = walk(r+1, c, m, n, memo) + walk(r, c+1, m, n, memo)
    return memo[r][c]
}

func uniquePaths(m int, n int) int {
    memo := make([][]int, m)
    for i := range memo {
        memo[i] = make([]int, n)
        for j := range memo[i] {
            memo[i][j] = -1
        }
    }
    return walk(0, 0, m, n, memo)
}
'''
