space_class = "O(n^2)"
time_expr = "O(n^2)"
space_expr = "O(n^2)"
rationale = "TRAP: the slice copies n-1, n-2, ... elements, so total copying is O(n^2); every frame keeps its own copy alive down the recursion, so peak space is also O(n^2). Go slicing is an O(1) view, so the Go override is O(n) time (n calls) and O(n) space (the stack). This differs by language on purpose."

[case.sources]
python = '''
def sum_slices(nums):
    if not nums:
        return 0
    return nums[0] + sum_slices(nums[1:])
'''
cpp = '''
int sumSlices(vector<int> nums) {
    if (nums.empty()) return 0;
    return nums[0] + sumSlices(vector<int>(nums.begin() + 1, nums.end()));
}
'''
java = '''
class Solution {
    public int sumSlices(int[] nums) {
        if (nums.length == 0) return 0;
        return nums[0] + sumSlices(Arrays.copyOfRange(nums, 1, nums.length));
    }
}
'''
