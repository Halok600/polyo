[[case]]
id = "rec_permutations_swap_count"
title = "Count permutations by swapping in place"
tags = ["recursion", "backtracking", "factorial", "loop-in-recursion", "interprocedural"]
time_class = "O(2^n)"
space_class = "O(n)"
time_expr = "O(n!)"
space_expr = "O(n)"
rationale = "At depth i the loop has n-i children, so there are n * (n-1) * ... leaves: n! leaves and O(n!) nodes in total. The legacy taxonomy tops out at O(2^n), so time_class is the lossy cap and the expression carries O(n!). The array is permuted in place, so space is the O(n) stack."

[case.sources]
python = '''
def permute(nums, i):
    if i == len(nums):
        return 1
    count = 0
    for j in range(i, len(nums)):
        nums[i], nums[j] = nums[j], nums[i]
        count += permute(nums, i + 1)
        nums[i], nums[j] = nums[j], nums[i]
    return count


def count_permutations(nums):
    return permute(nums, 0)
'''
cpp = '''
int permute(vector<int>& nums, int i) {
    if (i == nums.size()) return 1;
    int count = 0;
    for (int j = i; j < nums.size(); j++) {
        swap(nums[i], nums[j]);
        count += permute(nums, i + 1);
        swap(nums[i], nums[j]);
    }
    return count;
}

int countPermutations(vector<int>& nums) {
    return permute(nums, 0);
}
'''
java = '''
class Solution {
    public int countPermutations(int[] nums) {
        return permute(nums, 0);
    }

    private int permute(int[] nums, int i) {
        if (i == nums.length) return 1;
        int count = 0;
        for (int j = i; j < nums.length; j++) {
            int t = nums[i];
            nums[i] = nums[j];
            nums[j] = t;
            count += permute(nums, i + 1);
            t = nums[i];
            nums[i] = nums[j];
            nums[j] = t;
        }
        return count;
    }
}
'''
javascript = '''
function permute(nums, i) {
  if (i === nums.length) return 1;
  let count = 0;
  for (let j = i; j < nums.length; j++) {
    [nums[i], nums[j]] = [nums[j], nums[i]];
    count += permute(nums, i + 1);
    [nums[i], nums[j]] = [nums[j], nums[i]];
  }
  return count;
}

function countPermutations(nums) {
  return permute(nums, 0);
}
'''
go = '''
func permute(nums []int, i int) int {
    if i == len(nums) {
        return 1
    }
    count := 0
    for j := i; j < len(nums); j++ {
        nums[i], nums[j] = nums[j], nums[i]
        count += permute(nums, i+1)
        nums[i], nums[j] = nums[j], nums[i]
    }
    return count
}

func countPermutations(nums []int) int {
    return permute(nums, 0)
}
'''

