[[case]]
id = "rec_fib_memoized"
title = "Fibonacci with a memo table"
tags = ["recursion", "memoization", "integer-parameter", "interprocedural", "leetcode"]
time_class = "O(n)"
space_class = "O(n)"
time_expr = "O(n)"
space_expr = "O(n)"
rationale = "Each of the n+1 distinct arguments is computed once and then served from the memo: n states * O(1). The memo holds n entries and the recursion is n deep."

[case.sources]
python = '''
def fib(n, memo):
    if n < 2:
        return n
    if n in memo:
        return memo[n]
    memo[n] = fib(n - 1, memo) + fib(n - 2, memo)
    return memo[n]


def fibonacci(n):
    return fib(n, {})
'''
cpp = '''
long long fib(int n, unordered_map<int, long long>& memo) {
    if (n < 2) return n;
    if (memo.count(n)) return memo[n];
    memo[n] = fib(n - 1, memo) + fib(n - 2, memo);
    return memo[n];
}

long long fibonacci(int n) {
    unordered_map<int, long long> memo;
    return fib(n, memo);
}
'''
java = '''
class Solution {
    public long fibonacci(int n) {
        return fib(n, new HashMap<>());
    }

    private long fib(int n, Map<Integer, Long> memo) {
        if (n < 2) return n;
        if (memo.containsKey(n)) return memo.get(n);
        long value = fib(n - 1, memo) + fib(n - 2, memo);
        memo.put(n, value);
        return value;
    }
}
'''
javascript = '''
function fib(n, memo) {
  if (n < 2) return n;
  if (memo.has(n)) return memo.get(n);
  const value = fib(n - 1, memo) + fib(n - 2, memo);
  memo.set(n, value);
  return value;
}

function fibonacci(n) {
  return fib(n, new Map());
}
'''
go = '''
func fib(n int, memo map[int]int) int {
    if n < 2 {
        return n
    }
    if v, ok := memo[n]; ok {
        return v
    }
    memo[n] = fib(n-1, memo) + fib(n-2, memo)
    return memo[n]
}

func fibonacci(n int) int {
    return fib(n, make(map[int]int))
}
'''

