func topoOrder(n int, edges [][]int) []int {
    graph := make([][]int, n)
    indeg := make([]int, n)
    for _, e := range edges {
        graph[e[0]] = append(graph[e[0]], e[1])
        indeg[e[1]]++
    }
    queue := []int{}
    for i := 0; i < n; i++ {
        if indeg[i] == 0 {
            queue = append(queue, i)
        }
    }
    order := []int{}
    head := 0
    for head < len(queue) {
        u := queue[head]
        head++
        order = append(order, u)
