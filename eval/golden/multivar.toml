# Golden group: algorithms with more than one independent size.
# Naming convention for expressions: size variables are named n, m, k in the order their
# parameters appear, among the variables used by the time or space expression. A 2-D parameter
# contributes rows then columns. For a graph given as an adjacency list, n is the number of
# nodes (len of the outer list) and m is the total number of adjacency entries (the edges).
# Factors in a product and terms in a sum are compared order-insensitively; the legacy class
# column collapses every variable to n.

