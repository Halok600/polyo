id = "grid_dfs_island_count"
title = "Count islands by sinking visited land with DFS"
tags = ["multi-variable", "grid", "recursion", "visited-guard", "leetcode"]
time_class = "O(n^2)"
space_class = "O(n^2)"
time_expr = "O(n * m)"
space_expr = "O(n * m)"
rationale = "The scan visits rows*cols cells; sink() turns a land cell to water before recursing, so each cell is expanded at most once. In the worst case (all land) the recursion is rows*cols deep, so the stack is O(rows*cols)."

[case.sources]
python = '''
def sink(grid, r, c):
    if r < 0 or c < 0 or r >= len(grid) or c >= len(grid[0]) or grid[r][c] != 1:
        return
    grid[r][c] = 0
    sink(grid, r + 1, c)
    sink(grid, r - 1, c)
    sink(grid, r, c + 1)
    sink(grid, r, c - 1)


def num_islands(grid):
    count = 0
    for r in range(len(grid)):
        for c in range(len(grid[0])):
            if grid[r][c] == 1:
                count += 1
                sink(grid, r, c)
    return count
'''
cpp = '''
void sink(vector<vector<int>>& grid, int r, int c) {
    if (r < 0 || c < 0 || r >= grid.size() || c >= grid[0].size() || grid[r][c] != 1) return;
    grid[r][c] = 0;
    sink(grid, r + 1, c);
    sink(grid, r - 1, c);
    sink(grid, r, c + 1);
    sink(grid, r, c - 1);
}

int numIslands(vector<vector<int>>& grid) {
    int count = 0;
    for (int r = 0; r < grid.size(); r++) {
        for (int c = 0; c < grid[0].size(); c++) {
            if (grid[r][c] == 1) {
                count++;
                sink(grid, r, c);
            }
        }
    }
    return count;
}
'''
