rationale = "Each iteration advances i or j; the tail loops drain what is left: len(a) + len(b) steps. The merged output holds len(a) + len(b) elements."

[case.sources]
python = '''
def merge_sorted(a, b):
    out = []
    i = 0
    j = 0
    while i < len(a) and j < len(b):
        if a[i] <= b[j]:
            out.append(a[i])
            i += 1
        else:
            out.append(b[j])
            j += 1
    while i < len(a):
        out.append(a[i])
        i += 1
    while j < len(b):
        out.append(b[j])
        j += 1
    return out
'''
