[[case]]
id = "knapsack_rolling_dp"
title = "0/1 knapsack with a one-dimensional table"
tags = ["multi-variable", "dp", "nested-loop", "integer-parameter", "allocation"]
time_class = "O(n^2)"
space_class = "O(n)"
time_expr = "O(n * m)"
space_expr = "O(m)"
rationale = "n is the number of items; m is the capacity (an integer VALUE used as a bound). For each item the inner loop walks at most capacity+1 slots: n*m time. The table has capacity+1 slots: O(m) space."

[case.sources]
python = '''
def knapsack(weights, values, capacity):
    dp = [0] * (capacity + 1)
    for i in range(len(weights)):
        for w in range(capacity, weights[i] - 1, -1):
            dp[w] = max(dp[w], dp[w - weights[i]] + values[i])
    return dp[capacity]
'''
cpp = '''
int knapsack(vector<int>& weights, vector<int>& values, int capacity) {
    vector<int> dp(capacity + 1, 0);
    for (int i = 0; i < weights.size(); i++) {
        for (int w = capacity; w >= weights[i]; w--) {
            dp[w] = max(dp[w], dp[w - weights[i]] + values[i]);
        }
    }
    return dp[capacity];
}
'''
java = '''
class Solution {
    public int knapsack(int[] weights, int[] values, int capacity) {
        int[] dp = new int[capacity + 1];
        for (int i = 0; i < weights.length; i++) {
            for (int w = capacity; w >= weights[i]; w--) {
                dp[w] = Math.max(dp[w], dp[w - weights[i]] + values[i]);
            }
        }
        return dp[capacity];
    }
}
'''
