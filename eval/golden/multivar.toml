title = "Recursive depth-first reachability count"
tags = ["multi-variable", "graph", "recursion", "visited-guard", "interprocedural"]
time_class = "O(n)"
space_class = "O(n)"
time_expr = "O(n + m)"
space_expr = "O(n)"
rationale = "The visited guard makes each node expand once, scanning its adjacency list once: nodes + edges. The visited array is O(nodes) and the recursion can be nodes deep."

[case.sources]
python = '''
def dfs(graph, node, visited):
    visited[node] = True
    count = 1
    for nxt in graph[node]:
        if not visited[nxt]:
            count += dfs(graph, nxt, visited)
    return count


def count_reachable(graph, start):
    visited = [False] * len(graph)
    return dfs(graph, start, visited)
'''
