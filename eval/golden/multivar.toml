[[case]]
id = "graph_topological_sort_kahn"
title = "Topological order with Kahn's algorithm"
tags = ["multi-variable", "graph", "queue", "amortized", "allocation"]
time_class = "O(n)"
space_class = "O(n)"
time_expr = "O(n + m)"
space_expr = "O(n + m)"
rationale = "n is the node count (an integer parameter) and m is len(edges). Building the adjacency list is O(n + m); every node is enqueued once (its in-degree reaches zero once) and every edge is relaxed once. The adjacency list, in-degree array and queue are O(n + m)."

[case.sources]
python = '''
def topo_order(n, edges):
    graph = [[] for _ in range(n)]
    indeg = [0] * n
    for u, v in edges:
        graph[u].append(v)
        indeg[v] += 1
    queue = [i for i in range(n) if indeg[i] == 0]
    order = []
    head = 0
    while head < len(queue):
        u = queue[head]
        head += 1
        order.append(u)
        for v in graph[u]:
            indeg[v] -= 1
            if indeg[v] == 0:
                queue.append(v)
    return order
'''
cpp = '''
vector<int> topoOrder(int n, vector<vector<int>>& edges) {
    vector<vector<int>> graph(n);
    vector<int> indeg(n, 0);
    for (auto& e : edges) {
        graph[e[0]].push_back(e[1]);
        indeg[e[1]]++;
    }
    vector<int> order;
    queue<int> q;
    for (int i = 0; i < n; i++) {
        if (indeg[i] == 0) q.push(i);
    }
    while (!q.empty()) {
        int u = q.front();
        q.pop();
        order.push_back(u);
        for (int v : graph[u]) {
            indeg[v]--;
            if (indeg[v] == 0) q.push(v);
        }
    }
    return order;
}
'''
java = '''
class Solution {
    public List<Integer> topoOrder(int n, int[][] edges) {
        List<List<Integer>> graph = new ArrayList<>();
        for (int i = 0; i < n; i++) graph.add(new ArrayList<>());
        int[] indeg = new int[n];
        for (int[] e : edges) {
            graph.get(e[0]).add(e[1]);
            indeg[e[1]]++;
        }
        Queue<Integer> queue = new ArrayDeque<>();
        for (int i = 0; i < n; i++) {
            if (indeg[i] == 0) queue.add(i);
        }
        List<Integer> order = new ArrayList<>();
        while (!queue.isEmpty()) {
            int u = queue.poll();
            order.add(u);
            for (int v : graph.get(u)) {
                indeg[v]--;
                if (indeg[v] == 0) queue.add(v);
            }
        }
        return order;
    }
}
'''
