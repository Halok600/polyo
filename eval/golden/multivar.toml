func shortestPath(grid [][]int) int {
    rows := len(grid)
    cols := len(grid[0])
    dist := make([][]int, rows)
    for i := range dist {
        dist[i] = make([]int, cols)
        for j := range dist[i] {
            dist[i][j] = -1
        }
    }
