[[case]]
id = "graph_bfs_adjacency_list"
title = "Breadth-first traversal of an adjacency list"
tags = ["multi-variable", "graph", "queue", "visited-guard", "amortized", "leetcode"]
time_class = "O(n)"
space_class = "O(n)"
time_expr = "O(n + m)"
space_expr = "O(n)"
rationale = "Each node is enqueued at most once (the visited guard), and each adjacency entry is scanned once: nodes + edges. The visited set, queue and order list are O(nodes)."

[case.sources]
python = '''
from collections import deque


def bfs_order(graph, start):
    visited = {start}
    queue = deque([start])
    order = []
    while queue:
        node = queue.popleft()
        order.append(node)
        for nxt in graph[node]:
            if nxt not in visited:
                visited.add(nxt)
                queue.append(nxt)
    return order
'''
cpp = '''
vector<int> bfsOrder(vector<vector<int>>& graph, int start) {
    vector<bool> visited(graph.size(), false);
    queue<int> q;
    vector<int> order;
    visited[start] = true;
    q.push(start);
    while (!q.empty()) {
        int node = q.front();
        q.pop();
        order.push_back(node);
        for (int nxt : graph[node]) {
            if (!visited[nxt]) {
                visited[nxt] = true;
                q.push(nxt);
            }
        }
    }
    return order;
}
'''
java = '''
class Solution {
    public List<Integer> bfsOrder(List<List<Integer>> graph, int start) {
        boolean[] visited = new boolean[graph.size()];
        Queue<Integer> queue = new ArrayDeque<>();
        List<Integer> order = new ArrayList<>();
        visited[start] = true;
        queue.add(start);
        while (!queue.isEmpty()) {
            int node = queue.poll();
            order.add(node);
            for (int nxt : graph.get(node)) {
                if (!visited[nxt]) {
                    visited[nxt] = true;
                    queue.add(nxt);
                }
            }
        }
        return order;
    }
}
'''
javascript = '''
function bfsOrder(graph, start) {
  const visited = new Array(graph.length).fill(false);
  const queue = [start];
  const order = [];
  visited[start] = true;
  let head = 0;
  while (head < queue.length) {
    const node = queue[head++];
    order.push(node);
    for (const nxt of graph[node]) {
      if (!visited[nxt]) {
        visited[nxt] = true;
        queue.push(nxt);
      }
    }
  }
  return order;
}
'''
go = '''
func bfsOrder(graph [][]int, start int) []int {
    visited := make([]bool, len(graph))
    queue := []int{start}
    order := []int{}
    visited[start] = true
    for len(queue) > 0 {
        node := queue[0]
        queue = queue[1:]
        order = append(order, node)
        for _, nxt := range graph[node] {
            if !visited[nxt] {
                visited[nxt] = true
                queue = append(queue, nxt)
            }
        }
    }
    return order
}
'''

