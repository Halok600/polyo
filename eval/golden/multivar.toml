    vector<int> out;
    int i = 0;
    int j = 0;
    while (i < a.size() && j < b.size()) {
        if (a[i] <= b[j]) {
            out.push_back(a[i]);
            i++;
        } else {
            out.push_back(b[j]);
            j++;
        }
    }
    while (i < a.size()) {
        out.push_back(a[i]);
        i++;
    }
    while (j < b.size()) {
        out.push_back(b[j]);
        j++;
    }
    return out;
}
'''
