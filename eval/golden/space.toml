# Golden group: cases chosen to pin SPACE answers.
# The shipped model got space nearly inverted on simple code (an n x n builder came out O(1) and
# an allocation-free two-sum came out O(n^2)), so space gets its own group. Convention: space is
# the memory the function allocates beyond its inputs, including a returned result, at its peak.

[[case]]
id = "space_temp_array_each_iteration"
title = "A fresh length-n scratch array on every iteration"
tags = ["space", "allocation", "nested-loop", "peak-vs-total"]
time_class = "O(n^2)"
space_class = "O(n)"
time_expr = "O(n^2)"
space_expr = "O(n)"
rationale = "TRAP: n allocations of n elements is n^2 total allocated, but each scratch array is dead before the next iteration, so the PEAK is one array: O(n). Time is n iterations each filling n slots."

[case.sources]
python = '''
def windowed_total(nums):
    n = len(nums)
    total = 0
    for i in range(n):
        tmp = [0] * n
        for j in range(n):
            tmp[j] = nums[j] + i
        total += tmp[i]
    return total
'''
cpp = '''
int windowedTotal(vector<int>& nums) {
    int n = nums.size();
    int total = 0;
    for (int i = 0; i < n; i++) {
        vector<int> tmp(n, 0);
        for (int j = 0; j < n; j++) {
            tmp[j] = nums[j] + i;
        }
        total += tmp[i];
    }
    return total;
}
'''
java = '''
class Solution {
    public int windowedTotal(int[] nums) {
        int n = nums.length;
        int total = 0;
        for (int i = 0; i < n; i++) {
            int[] tmp = new int[n];
            for (int j = 0; j < n; j++) {
                tmp[j] = nums[j] + i;
            }
            total += tmp[i];
        }
        return total;
    }
}
'''
javascript = '''
function windowedTotal(nums) {
  const n = nums.length;
  let total = 0;
  for (let i = 0; i < n; i++) {
    const tmp = new Array(n).fill(0);
    for (let j = 0; j < n; j++) {
      tmp[j] = nums[j] + i;
    }
    total += tmp[i];
  }
  return total;
}
'''
go = '''
func windowedTotal(nums []int) int {
    n := len(nums)
    total := 0
    for i := 0; i < n; i++ {
        tmp := make([]int, n)
        for j := 0; j < n; j++ {
            tmp[j] = nums[j] + i
        }
        total += tmp[i]
    }
    return total
}
'''

[[case]]
id = "space_square_table"
title = "Multiplication table of size n x n"
tags = ["space", "allocation", "nested-loop", "integer-parameter"]
time_class = "O(n^2)"
space_class = "O(n^2)"
time_expr = "O(n^2)"
space_expr = "O(n^2)"
rationale = "An n x n result is allocated and filled cell by cell."

[case.sources]
python = '''
def multiplication_table(n):
    table = [[0] * n for _ in range(n)]
    for i in range(n):
        for j in range(n):
            table[i][j] = (i + 1) * (j + 1)
    return table
'''
cpp = '''
vector<vector<int>> multiplicationTable(int n) {
    vector<vector<int>> table(n, vector<int>(n, 0));
    for (int i = 0; i < n; i++) {
        for (int j = 0; j < n; j++) {
            table[i][j] = (i + 1) * (j + 1);
        }
    }
    return table;
}
'''
java = '''
class Solution {
    public int[][] multiplicationTable(int n) {
        int[][] table = new int[n][n];
        for (int i = 0; i < n; i++) {
            for (int j = 0; j < n; j++) {
                table[i][j] = (i + 1) * (j + 1);
            }
        }
        return table;
    }
}
'''
javascript = '''
function multiplicationTable(n) {
  const table = Array.from({ length: n }, () => new Array(n).fill(0));
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      table[i][j] = (i + 1) * (j + 1);
    }
  }
  return table;
}
'''
go = '''
func multiplicationTable(n int) [][]int {
    table := make([][]int, n)
    for i := range table {
        table[i] = make([]int, n)
    }
    for i := 0; i < n; i++ {
        for j := 0; j < n; j++ {
            table[i][j] = (i + 1) * (j + 1)
        }
    }
    return table
}
'''

[[case]]
id = "space_dp_array_climb_stairs"
title = "Climbing stairs with a DP array"
tags = ["space", "allocation", "dp", "integer-parameter", "leetcode"]
time_class = "O(n)"
space_class = "O(n)"
time_expr = "O(n)"
space_expr = "O(n)"
rationale = "A length n+1 table filled in one pass."

[case.sources]
python = '''
def climb_stairs(n):
    if n <= 2:
        return n
    dp = [0] * (n + 1)
    dp[1] = 1
    dp[2] = 2
    for i in range(3, n + 1):
        dp[i] = dp[i - 1] + dp[i - 2]
    return dp[n]
'''
cpp = '''
int climbStairs(int n) {
    if (n <= 2) return n;
    vector<int> dp(n + 1, 0);
    dp[1] = 1;
    dp[2] = 2;
    for (int i = 3; i <= n; i++) {
        dp[i] = dp[i - 1] + dp[i - 2];
    }
    return dp[n];
}
'''
java = '''
class Solution {
    public int climbStairs(int n) {
        if (n <= 2) return n;
        int[] dp = new int[n + 1];
        dp[1] = 1;
        dp[2] = 2;
        for (int i = 3; i <= n; i++) {
            dp[i] = dp[i - 1] + dp[i - 2];
        }
        return dp[n];
    }
}
'''
javascript = '''
function climbStairs(n) {
  if (n <= 2) return n;
  const dp = new Array(n + 1).fill(0);
  dp[1] = 1;
  dp[2] = 2;
  for (let i = 3; i <= n; i++) {
    dp[i] = dp[i - 1] + dp[i - 2];
  }
  return dp[n];
}
'''
go = '''
func climbStairs(n int) int {
    if n <= 2 {
        return n
    }
    dp := make([]int, n+1)
    dp[1] = 1
    dp[2] = 2
    for i := 3; i <= n; i++ {
        dp[i] = dp[i-1] + dp[i-2]
    }
    return dp[n]
}
'''
c = '''
int climbStairs(int n) {
    if (n <= 2) return n;
    int* dp = calloc(n + 1, sizeof(int));
    dp[1] = 1;
    dp[2] = 2;
    for (int i = 3; i <= n; i++) {
        dp[i] = dp[i - 1] + dp[i - 2];
    }
    int result = dp[n];
    free(dp);
    return result;
}
'''

