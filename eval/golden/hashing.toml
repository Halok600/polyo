[[case]]
id = "hash_set_membership_dedupe"
title = "Dedupe by testing membership in a set"
tags = ["hash-set", "membership"]
time_class = "O(n)"
space_class = "O(n)"
time_expr = "O(n)"
space_expr = "O(n)"
rationale = "The same loop as hidden_list_membership_dedupe, but the membership test is on a hash set: O(1) average."

[case.sources]
python = '''
def dedupe_keep_order(nums):
    seen = set()
    out = []
    for x in nums:
        if x not in seen:
            seen.add(x)
            out.append(x)
    return out
'''
cpp = '''
vector<int> dedupeKeepOrder(vector<int>& nums) {
    unordered_set<int> seen;
    vector<int> out;
    for (int x : nums) {
        if (seen.find(x) == seen.end()) {
            seen.insert(x);
            out.push_back(x);
        }
    }
    return out;
}
'''
java = '''
class Solution {
    public List<Integer> dedupeKeepOrder(int[] nums) {
        Set<Integer> seen = new HashSet<>();
        List<Integer> out = new ArrayList<>();
        for (int x : nums) {
            if (!seen.contains(x)) {
                seen.add(x);
                out.add(x);
            }
        }
        return out;
    }
}
'''
javascript = '''
function dedupeKeepOrder(nums) {
  const seen = new Set();
  const out = [];
  for (const x of nums) {
    if (!seen.has(x)) {
      seen.add(x);
      out.push(x);
    }
  }
  return out;
}
'''
go = '''
func dedupeKeepOrder(nums []int) []int {
    seen := make(map[int]bool)
    out := []int{}
    for _, x := range nums {
        if !seen[x] {
            seen[x] = true
            out = append(out, x)
        }
    }
    return out
}
'''

[[case]]
id = "hash_prefix_sum_subarray_count"
title = "Subarray Sum Equals K with prefix sums"
tags = ["hash-map", "prefix-sum", "leetcode"]
time_class = "O(n)"
space_class = "O(n)"
time_expr = "O(n)"
space_expr = "O(n)"
rationale = "One pass; each step is two O(1) average map operations. The map holds up to n+1 prefix sums. k is only added and compared, never a bound."

[case.sources]
python = '''
def subarray_sum(nums, k):
    counts = {0: 1}
    prefix = 0
    total = 0
    for x in nums:
        prefix += x
        total += counts.get(prefix - k, 0)
        counts[prefix] = counts.get(prefix, 0) + 1
    return total
'''
cpp = '''
int subarraySum(vector<int>& nums, int k) {
    unordered_map<int, int> counts;
    counts[0] = 1;
    int prefix = 0;
    int total = 0;
    for (int x : nums) {
        prefix += x;
        if (counts.count(prefix - k)) total += counts[prefix - k];
        counts[prefix]++;
    }
    return total;
}
'''
java = '''
class Solution {
    public int subarraySum(int[] nums, int k) {
        Map<Integer, Integer> counts = new HashMap<>();
        counts.put(0, 1);
        int prefix = 0;
        int total = 0;
        for (int x : nums) {
            prefix += x;
            total += counts.getOrDefault(prefix - k, 0);
            counts.put(prefix, counts.getOrDefault(prefix, 0) + 1);
        }
        return total;
    }
}
'''
javascript = '''
function subarraySum(nums, k) {
  const counts = new Map();
  counts.set(0, 1);
  let prefix = 0;
  let total = 0;
  for (const x of nums) {
    prefix += x;
    total += counts.get(prefix - k) || 0;
    counts.set(prefix, (counts.get(prefix) || 0) + 1);
  }
  return total;
}
'''
go = '''
func subarraySum(nums []int, k int) int {
    counts := map[int]int{0: 1}
    prefix := 0
    total := 0
    for _, x := range nums {
        prefix += x
        total += counts[prefix-k]
        counts[prefix]++
    }
    return total
}
'''

[[case]]
id = "hidden_pop_front_in_loop"
title = "Drain a list from the front"
tags = ["library-call", "hidden-cost", "queue"]
time_class = "O(n^2)"
space_class = "O(n)"
time_expr = "O(n^2)"
space_expr = "O(n)"
rationale = "TRAP: removing the first element of an array-backed list shifts every remaining element, O(n) each, n times. A deque or head index would be O(n). The Go version uses the copy-shift idiom (a plain items[1:] would be an O(1) view)."

[case.sources]
python = '''
def drain_front(nums):
    items = list(nums)
    total = 0
    while items:
        total += items.pop(0)
    return total
'''
cpp = '''
int drainFront(vector<int>& nums) {
    vector<int> items = nums;
    int total = 0;
    while (!items.empty()) {
        total += items.front();
        items.erase(items.begin());
    }
    return total;
}
'''
java = '''
class Solution {
    public int drainFront(int[] nums) {
        List<Integer> items = new ArrayList<>();
        for (int x : nums) items.add(x);
        int total = 0;
        while (!items.isEmpty()) {
            total += items.remove(0);
        }
        return total;
    }
}
'''
javascript = '''
function drainFront(nums) {
  const items = [...nums];
  let total = 0;
  while (items.length > 0) {
    total += items.shift();
  }
  return total;
}
'''
go = '''
func drainFront(nums []int) int {
    items := append([]int(nil), nums...)
    total := 0
    for len(items) > 0 {
        total += items[0]
        items = append(items[:0], items[1:]...)
    }
    return total
}
'''

