# Golden group: hash containers, strings and hidden library costs.
# Convention: hash-map / hash-set operations are O(1) average (the LeetCode editorial convention);
# list membership, front removal and immutable-string concatenation are O(n) per operation.
# Where a language genuinely differs (Go slicing is an O(1) view, C++ std::string appends are
# amortised O(1)) the case carries an explicit per-language override explained in its rationale.

[[case]]
id = "hash_two_sum"
title = "Two Sum with a hash map"
tags = ["hash-map", "leetcode", "early-exit"]
time_class = "O(n)"
space_class = "O(n)"
time_expr = "O(n)"
space_expr = "O(n)"
rationale = "One pass; each lookup/insert is O(1) average. The map holds up to n entries."

[case.sources]
python = '''
def two_sum(nums, target):
    seen = {}
    for i, x in enumerate(nums):
        if target - x in seen:
            return [seen[target - x], i]
        seen[x] = i
    return []
'''
cpp = '''
vector<int> twoSum(vector<int>& nums, int target) {
    unordered_map<int, int> seen;
    for (int i = 0; i < nums.size(); i++) {
        auto it = seen.find(target - nums[i]);
        if (it != seen.end()) return {it->second, i};
        seen[nums[i]] = i;
    }
    return {};
}
'''
java = '''
class Solution {
    public int[] twoSum(int[] nums, int target) {
        Map<Integer, Integer> seen = new HashMap<>();
        for (int i = 0; i < nums.length; i++) {
            if (seen.containsKey(target - nums[i])) {
                return new int[]{seen.get(target - nums[i]), i};
            }
            seen.put(nums[i], i);
        }
        return new int[]{};
    }
}
'''
javascript = '''
function twoSum(nums, target) {
  const seen = new Map();
  for (let i = 0; i < nums.length; i++) {
    if (seen.has(target - nums[i])) {
      return [seen.get(target - nums[i]), i];
    }
    seen.set(nums[i], i);
  }
  return [];
}
'''
go = '''
func twoSum(nums []int, target int) []int {
    seen := make(map[int]int)
    for i, x := range nums {
        if j, ok := seen[target-x]; ok {
            return []int{j, i}
        }
        seen[x] = i
    }
    return []int{}
}
'''

