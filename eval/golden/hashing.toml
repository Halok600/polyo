[[case]]
id = "hash_most_frequent"
title = "Most frequent value via a counter map"
tags = ["hash-map", "counting"]
time_class = "O(n)"
space_class = "O(n)"
time_expr = "O(n)"
space_expr = "O(n)"
rationale = "Counting pass is O(n); the second loop walks the distinct keys, of which there are at most n."

[case.sources]
python = '''
def most_frequent(nums):
    counts = {}
    for x in nums:
        counts[x] = counts.get(x, 0) + 1
    best = nums[0]
    for x in counts:
        if counts[x] > counts[best]:
            best = x
    return best
'''
cpp = '''
int mostFrequent(vector<int>& nums) {
    unordered_map<int, int> counts;
    for (int x : nums) counts[x]++;
    int best = nums[0];
    int bestCount = 0;
    for (auto& kv : counts) {
        if (kv.second > bestCount) {
            best = kv.first;
            bestCount = kv.second;
        }
    }
    return best;
}
'''
java = '''
class Solution {
    public int mostFrequent(int[] nums) {
        Map<Integer, Integer> counts = new HashMap<>();
        for (int x : nums) {
            counts.put(x, counts.getOrDefault(x, 0) + 1);
        }
        int best = nums[0];
        int bestCount = 0;
        for (Map.Entry<Integer, Integer> e : counts.entrySet()) {
            if (e.getValue() > bestCount) {
                best = e.getKey();
                bestCount = e.getValue();
            }
        }
        return best;
    }
}
'''
javascript = '''
function mostFrequent(nums) {
  const counts = new Map();
  for (const x of nums) {
    counts.set(x, (counts.get(x) || 0) + 1);
  }
  let best = nums[0];
  let bestCount = 0;
  for (const [k, v] of counts) {
    if (v > bestCount) {
      best = k;
      bestCount = v;
    }
  }
  return best;
}
'''
go = '''
func mostFrequent(nums []int) int {
    counts := make(map[int]int)
    for _, x := range nums {
        counts[x]++
    }
    best := nums[0]
    bestCount := 0
    for k, v := range counts {
        if v > bestCount {
            best = k
            bestCount = v
        }
    }
    return best
}
'''

[[case]]
id = "hash_first_unique_char_table"
title = "First non-repeating character with a 26-slot table"
tags = ["counting", "fixed-table", "string", "leetcode"]
time_class = "O(n)"
space_class = "O(1)"
time_expr = "O(n)"
space_expr = "O(1)"
rationale = "Two linear passes over the string; the counter is a fixed 26-slot array, so space is constant (unlike a dict keyed by arbitrary characters)."

[case.sources]
python = '''
def first_unique_char(s):
    counts = [0] * 26
    for ch in s:
        counts[ord(ch) - ord("a")] += 1
    for i in range(len(s)):
        if counts[ord(s[i]) - ord("a")] == 1:
            return i
    return -1
'''
cpp = '''
int firstUniqueChar(string& s) {
    int counts[26] = {0};
    for (char ch : s) counts[ch - 'a']++;
    for (int i = 0; i < s.size(); i++) {
        if (counts[s[i] - 'a'] == 1) return i;
    }
    return -1;
}
'''
java = '''
class Solution {
    public int firstUniqueChar(String s) {
        int[] counts = new int[26];
        for (int i = 0; i < s.length(); i++) counts[s.charAt(i) - 'a']++;
        for (int i = 0; i < s.length(); i++) {
            if (counts[s.charAt(i) - 'a'] == 1) return i;
        }
        return -1;
    }
}
'''
javascript = '''
function firstUniqueChar(s) {
  const counts = new Array(26).fill(0);
  for (let i = 0; i < s.length; i++) counts[s.charCodeAt(i) - 97]++;
  for (let i = 0; i < s.length; i++) {
    if (counts[s.charCodeAt(i) - 97] === 1) return i;
  }
  return -1;
}
'''
go = '''
func firstUniqueChar(s string) int {
    var counts [26]int
    for i := 0; i < len(s); i++ {
        counts[s[i]-'a']++
    }
    for i := 0; i < len(s); i++ {
        if counts[s[i]-'a'] == 1 {
            return i
        }
    }
    return -1
}
'''
c = '''
int firstUniqueChar(char* s) {
    int counts[26] = {0};
    for (int i = 0; s[i] != '\0'; i++) counts[s[i] - 'a']++;
    for (int i = 0; s[i] != '\0'; i++) {
        if (counts[s[i] - 'a'] == 1) return i;
    }
    return -1;
}
'''

