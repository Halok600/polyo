[[case]]
id = "lib_range_of_values"
title = "Range of values with built-in min, max and sum"
tags = ["library-call", "builtin"]
time_class = "O(n)"
space_class = "O(1)"
time_expr = "O(n)"
space_expr = "O(1)"
rationale = "Each of the three built-in reductions is one O(n) scan; constant extra space."

[case.sources]
python = '''
def value_range(nums):
    return max(nums) - min(nums) + sum(nums)
'''
cpp = '''
int valueRange(vector<int>& nums) {
    int hi = *max_element(nums.begin(), nums.end());
    int lo = *min_element(nums.begin(), nums.end());
    int total = accumulate(nums.begin(), nums.end(), 0);
    return hi - lo + total;
}
'''
java = '''
class Solution {
    public int valueRange(int[] nums) {
        int hi = Arrays.stream(nums).max().getAsInt();
        int lo = Arrays.stream(nums).min().getAsInt();
        int total = Arrays.stream(nums).sum();
        return hi - lo + total;
    }
}
'''
javascript = '''
function valueRange(nums) {
  const hi = nums.reduce((a, b) => Math.max(a, b));
  const lo = nums.reduce((a, b) => Math.min(a, b));
  const total = nums.reduce((a, b) => a + b, 0);
  return hi - lo + total;
}
'''
go = '''
func valueRange(nums []int) int {
    hi, lo, total := nums[0], nums[0], 0
    for _, x := range nums {
        if x > hi {
            hi = x
        }
        if x < lo {
            lo = x
        }
        total += x
    }
    return hi - lo + total
}
'''

