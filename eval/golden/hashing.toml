    return out;
}
'''
java = '''
class Solution {
    public int[] reversedCopy(int[] nums) {
        int[] out = new int[nums.length];
        for (int i = 0; i < nums.length; i++) {
            out[i] = nums[nums.length - 1 - i];
        }
        return out;
    }
}
