[[case]]
id = "cubic_substring_palindrome_check"
title = "Count palindromic substrings by slicing each one"
tags = ["string", "hidden-cost", "nested-loop", "language-semantics"]
time_class = "O(n^3)"
space_class = "O(n)"
time_expr = "O(n^3)"
space_expr = "O(n)"
rationale = "TRAP: two visible loops hide a third factor: each of the n^2 substrings is copied and reversed or compared in O(n). The Go version slices (an O(1) view) and uses an allocation-free palindrome helper, so its time is still n^3 but its auxiliary space is O(1): that space override differs by language on purpose."

[case.sources]
python = '''
def count_palindromes(s):
    count = 0
    for i in range(len(s)):
        for j in range(i + 1, len(s) + 1):
            sub = s[i:j]
            if sub == sub[::-1]:
                count += 1
    return count
'''
cpp = '''
int countPalindromes(string& s) {
    int count = 0;
    for (int i = 0; i < s.size(); i++) {
        for (int j = i + 1; j <= s.size(); j++) {
            string sub = s.substr(i, j - i);
            string rev(sub.rbegin(), sub.rend());
            if (sub == rev) count++;
        }
    }
    return count;
}
'''
java = '''
class Solution {
    public int countPalindromes(String s) {
        int count = 0;
        for (int i = 0; i < s.length(); i++) {
            for (int j = i + 1; j <= s.length(); j++) {
                String sub = s.substring(i, j);
                String rev = new StringBuilder(sub).reverse().toString();
                if (sub.equals(rev)) count++;
            }
        }
        return count;
    }
}
'''
javascript = '''
function countPalindromes(s) {
  let count = 0;
  for (let i = 0; i < s.length; i++) {
    for (let j = i + 1; j <= s.length; j++) {
      const sub = s.slice(i, j);
      const rev = sub.split("").reverse().join("");
      if (sub === rev) count++;
    }
  }
  return count;
}
'''
go = '''
func isPalindrome(sub string) bool {
    i := 0
    j := len(sub) - 1
    for i < j {
        if sub[i] != sub[j] {
            return false
        }
        i++
        j--
    }
    return true
}

func countPalindromes(s string) int {
    count := 0
    for i := 0; i < len(s); i++ {
        for j := i + 1; j <= len(s); j++ {
            if isPalindrome(s[i:j]) {
                count++
            }
        }
    }
    return count
}
'''

[case.overrides.go]
space_class = "O(1)"
space_expr = "O(1)"

