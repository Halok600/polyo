[[case]]
id = "kl_inorder_iterative_stack"
title = "Iterative inorder traversal with an explicit stack"
tags = ["known-limitation", "amortized", "tree", "stack", "while", "leetcode"]
time_class = "O(n)"
space_class = "O(n)"
time_expr = "O(n)"
space_expr = "O(n)"
rationale = "Each node is pushed once while walking left and popped once, so O(n) time; the stack and the output hold up to n nodes. The nested while loops chase tree pointers and drain a stack at the same time, which a loop-bound analysis cannot bound without modelling the tree and the stack together."

[case.sources]
python = '''
def inorder(root):
    out = []
    stack = []
    cur = root
    while cur or stack:
        while cur:
            stack.append(cur)
            cur = cur.left
        cur = stack.pop()
        out.append(cur.val)
        cur = cur.right
    return out
'''
cpp = '''
vector<int> inorder(TreeNode* root) {
    vector<int> out;
    stack<TreeNode*> st;
    TreeNode* cur = root;
    while (cur || !st.empty()) {
        while (cur) {
            st.push(cur);
            cur = cur->left;
        }
        cur = st.top();
        st.pop();
        out.push_back(cur->val);
        cur = cur->right;
    }
    return out;
}
'''
java = '''
class Solution {
    public List<Integer> inorder(TreeNode root) {
        List<Integer> out = new ArrayList<>();
        Deque<TreeNode> stack = new ArrayDeque<>();
        TreeNode cur = root;
        while (cur != null || !stack.isEmpty()) {
            while (cur != null) {
                stack.push(cur);
                cur = cur.left;
            }
            cur = stack.pop();
            out.add(cur.val);
            cur = cur.right;
        }
        return out;
    }
}
'''
javascript = '''
function inorder(root) {
  const out = [];
  const stack = [];
  let cur = root;
  while (cur || stack.length > 0) {
    while (cur) {
      stack.push(cur);
      cur = cur.left;
    }
    cur = stack.pop();
    out.push(cur.val);
    cur = cur.right;
  }
  return out;
}
'''
go = '''
func inorder(root *TreeNode) []int {
    out := []int{}
    stack := []*TreeNode{}
    cur := root
    for cur != nil || len(stack) > 0 {
        for cur != nil {
            stack = append(stack, cur)
            cur = cur.Left
        }
        cur = stack[len(stack)-1]
        stack = stack[:len(stack)-1]
        out = append(out, cur.Val)
        cur = cur.Right
    }
    return out
}
'''

[[case]]
id = "kl_dijkstra_heap"
title = "Dijkstra's algorithm with a binary heap"
tags = ["known-limitation", "multi-variable", "graph", "heap", "amortized", "leetcode"]
time_class = "O(n^2)"
space_class = "O(n)"
time_expr = "O((n + m) * log n)"
space_expr = "O(n + m)"
rationale = "Each edge relaxation pushes at most one heap entry, so there are at most m pushes and pops, each O(log n), plus n nodes: (n + m) log n. This needs the push count bounded by the number of relaxations AND stale pops skipped; legacy class collapses (n + m) log n to O(n^2) when m is taken as n^2. The heap can hold up to n + m entries."

[case.sources]
python = '''
import heapq


def dijkstra(graph, source):
    dist = [float("inf")] * len(graph)
    dist[source] = 0
    heap = [(0, source)]
    while heap:
        d, u = heapq.heappop(heap)
        if d > dist[u]:
            continue
        for v, w in graph[u]:
            if d + w < dist[v]:
                dist[v] = d + w
                heapq.heappush(heap, (dist[v], v))
    return dist
'''
cpp = '''
vector<int> dijkstra(vector<vector<pair<int, int>>>& graph, int source) {
    vector<int> dist(graph.size(), INT_MAX);
    priority_queue<pair<int, int>, vector<pair<int, int>>, greater<pair<int, int>>> heap;
    dist[source] = 0;
    heap.push({0, source});
    while (!heap.empty()) {
        pair<int, int> top = heap.top();
        heap.pop();
        int d = top.first;
        int u = top.second;
        if (d > dist[u]) continue;
        for (auto& edge : graph[u]) {
            int v = edge.first;
            int w = edge.second;
            if (d + w < dist[v]) {
                dist[v] = d + w;
                heap.push({dist[v], v});
            }
        }
    }
    return dist;
}
'''
java = '''
class Solution {
    public int[] dijkstra(List<List<int[]>> graph, int source) {
        int[] dist = new int[graph.size()];
        Arrays.fill(dist, Integer.MAX_VALUE);
        PriorityQueue<int[]> heap = new PriorityQueue<>((a, b) -> a[0] - b[0]);
        dist[source] = 0;
        heap.add(new int[]{0, source});
        while (!heap.isEmpty()) {
            int[] top = heap.poll();
            int d = top[0];
            int u = top[1];
            if (d > dist[u]) continue;
            for (int[] edge : graph.get(u)) {
                int v = edge[0];
                int w = edge[1];
                if (d + w < dist[v]) {
                    dist[v] = d + w;
                    heap.add(new int[]{dist[v], v});
                }
            }
        }
        return dist;
    }
}
'''
