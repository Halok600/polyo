func longestConsecutive(nums []int) int {
    values := make(map[int]bool)
    for _, x := range nums {
        values[x] = true
    }
    best := 0
    for num := range values {
        if !values[num-1] {
            cur := num
            length := 1
            for values[cur+1] {
