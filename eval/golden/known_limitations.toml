# Golden group: KNOWN-HARD cases. Every case here carries the `known-limitation` tag.
# They are correctly labelled, and they need reasoning a static engine cannot always do (an
# invariant that makes an inner loop amortised, a heap whose pops are bounded by pushes). They are
# reported in the scorecard SEPARATELY and are never counted in a phase gate: a failure here is a
# documented limit, not a regression. If the engine learns to solve one, the tag stays (the case
# stays in this group) but the scorecard shows it passing, which is the improvement we want to see.

[[case]]
id = "kl_longest_consecutive_sequence"
title = "Longest consecutive sequence with a start-of-run guard"
tags = ["known-limitation", "amortized", "hash-set", "while", "leetcode"]
time_class = "O(n)"
space_class = "O(n)"
time_expr = "O(n)"
space_expr = "O(n)"
rationale = "The inner while only starts when num-1 is NOT in the set, i.e. at the beginning of a run, and then walks that run once. Every element is walked at most once overall, so O(n). Proving that needs the guard's meaning, which a loop-bound analysis does not see: a naive analysis reports O(n^2)."

[case.sources]
python = '''
def longest_consecutive(nums):
    values = set(nums)
    best = 0
    for num in values:
        if num - 1 not in values:
            cur = num
            length = 1
            while cur + 1 in values:
                cur += 1
                length += 1
            best = max(best, length)
    return best
'''
cpp = '''
int longestConsecutive(vector<int>& nums) {
    unordered_set<int> values(nums.begin(), nums.end());
    int best = 0;
    for (int num : values) {
        if (!values.count(num - 1)) {
            int cur = num;
            int length = 1;
            while (values.count(cur + 1)) {
                cur++;
                length++;
            }
            best = max(best, length);
        }
    }
    return best;
}
'''
java = '''
class Solution {
    public int longestConsecutive(int[] nums) {
        Set<Integer> values = new HashSet<>();
        for (int x : nums) values.add(x);
        int best = 0;
        for (int num : values) {
            if (!values.contains(num - 1)) {
                int cur = num;
                int length = 1;
                while (values.contains(cur + 1)) {
                    cur++;
                    length++;
                }
                best = Math.max(best, length);
            }
        }
        return best;
    }
}
'''
