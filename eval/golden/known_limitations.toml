go = '''
type Item struct {
    dist int
    node int
}

type PQ []Item

func (p PQ) Len() int            { return len(p) }
func (p PQ) Less(i, j int) bool  { return p[i].dist < p[j].dist }
func (p PQ) Swap(i, j int)       { p[i], p[j] = p[j], p[i] }
func (p *PQ) Push(x any)         { *p = append(*p, x.(Item)) }
func (p *PQ) Pop() any {
    old := *p
    n := len(old)
    x := old[n-1]
    *p = old[:n-1]
    return x
}

func dijkstra(graph [][][2]int, source int) []int {
    dist := make([]int, len(graph))
    for i := range dist {
        dist[i] = math.MaxInt
    }
    dist[source] = 0
    pq := &PQ{}
    heap.Push(pq, Item{0, source})
    for pq.Len() > 0 {
        top := heap.Pop(pq).(Item)
        if top.dist > dist[top.node] {
            continue
        }
        for _, edge := range graph[top.node] {
            v, w := edge[0], edge[1]
            if top.dist+w < dist[v] {
                dist[v] = top.dist + w
                heap.Push(pq, Item{dist[v], v})
            }
        }
    }
    return dist
}
'''
