tags = ["linked-list", "pointer-chasing", "while", "leetcode"]
time_class = "O(n)"
space_class = "O(1)"
time_expr = "O(n)"
space_expr = "O(1)"
rationale = "fast advances two nodes per iteration; it either reaches the end or meets slow within O(n) steps. Two pointers, no allocation."

[case.sources]
python = '''
def has_cycle(head):
    slow = head
    fast = head
    while fast and fast.next:
        slow = slow.next
        fast = fast.next.next
        if slow is fast:
            return True
    return False
'''
cpp = '''
bool hasCycle(ListNode* head) {
    ListNode* slow = head;
    ListNode* fast = head;
    while (fast && fast->next) {
        slow = slow->next;
        fast = fast->next->next;
        if (slow == fast) return true;
    }
    return false;
}
'''
java = '''
class Solution {
    public boolean hasCycle(ListNode head) {
        ListNode slow = head;
        ListNode fast = head;
        while (fast != null && fast.next != null) {
            slow = slow.next;
            fast = fast.next.next;
            if (slow == fast) return true;
        }
        return false;
    }
}
'''
javascript = '''
function hasCycle(head) {
  let slow = head;
  let fast = head;
  while (fast && fast.next) {
