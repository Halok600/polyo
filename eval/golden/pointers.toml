# Golden group: pointers, windows, stacks, early exits and branching.
# These are the amortisation TRAPS: a naive product of loop bounds gives O(n^2) for code that is
# really O(n) (sliding window, monotonic stack), and the opposite trap where pointers are reset
# on every outer iteration, so the product is correct (expand-around-center).

[[case]]
id = "two_pointers_sorted_pair_sum"
title = "Pair sum in a sorted array with two pointers"
tags = ["two-pointers", "while", "early-exit"]
time_class = "O(n)"
space_class = "O(1)"
time_expr = "O(n)"
space_expr = "O(1)"
rationale = "Every iteration moves lo up or hi down, so lo and hi meet after at most n-1 iterations."

[case.sources]
python = '''
def pair_sum_sorted(nums, target):
    lo, hi = 0, len(nums) - 1
    while lo < hi:
        s = nums[lo] + nums[hi]
        if s == target:
            return [lo, hi]
        if s < target:
            lo += 1
        else:
            hi -= 1
    return []
'''
cpp = '''
vector<int> pairSumSorted(vector<int>& nums, int target) {
    int lo = 0;
    int hi = nums.size() - 1;
    while (lo < hi) {
        int s = nums[lo] + nums[hi];
        if (s == target) return {lo, hi};
        if (s < target) {
            lo++;
        } else {
            hi--;
        }
    }
    return {};
}
'''
java = '''
class Solution {
    public int[] pairSumSorted(int[] nums, int target) {
        int lo = 0;
        int hi = nums.length - 1;
        while (lo < hi) {
            int s = nums[lo] + nums[hi];
            if (s == target) return new int[]{lo, hi};
            if (s < target) {
                lo++;
            } else {
                hi--;
            }
        }
        return new int[]{};
    }
}
'''
javascript = '''
function pairSumSorted(nums, target) {
  let lo = 0;
  let hi = nums.length - 1;
  while (lo < hi) {
    const s = nums[lo] + nums[hi];
    if (s === target) return [lo, hi];
    if (s < target) {
      lo++;
    } else {
      hi--;
    }
  }
  return [];
}
'''
go = '''
func pairSumSorted(nums []int, target int) []int {
    lo := 0
    hi := len(nums) - 1
    for lo < hi {
        s := nums[lo] + nums[hi]
        if s == target {
            return []int{lo, hi}
        }
        if s < target {
            lo++
        } else {
            hi--
        }
    }
    return []int{}
}
'''

[[case]]
id = "sliding_window_longest_unique"
title = "Longest substring without repeating characters (shrinking window)"
tags = ["sliding-window", "amortized", "trap", "while", "hash-set", "leetcode"]
time_class = "O(n)"
space_class = "O(n)"
time_expr = "O(n)"
space_expr = "O(n)"
rationale = "TRAP: the while loop sits inside the for loop, so a naive product says O(n^2). But left only ever moves forward and is never reset, and each character is removed at most once, so the total inner work over the whole run is at most n. The window set holds up to n characters."

[case.sources]
python = '''
def longest_unique(s):
    window = set()
    left = 0
    best = 0
    for right in range(len(s)):
        while s[right] in window:
            window.remove(s[left])
            left += 1
        window.add(s[right])
        best = max(best, right - left + 1)
    return best
'''
cpp = '''
int longestUnique(string& s) {
    unordered_set<char> window;
    int left = 0;
    int best = 0;
    for (int right = 0; right < s.size(); right++) {
        while (window.count(s[right])) {
            window.erase(s[left]);
            left++;
        }
        window.insert(s[right]);
        best = max(best, right - left + 1);
    }
    return best;
}
'''
java = '''
class Solution {
    public int longestUnique(String s) {
        Set<Character> window = new HashSet<>();
        int left = 0;
        int best = 0;
        for (int right = 0; right < s.length(); right++) {
            while (window.contains(s.charAt(right))) {
                window.remove(s.charAt(left));
                left++;
            }
            window.add(s.charAt(right));
            best = Math.max(best, right - left + 1);
        }
        return best;
    }
}
'''
javascript = '''
function longestUnique(s) {
  const window = new Set();
  let left = 0;
  let best = 0;
  for (let right = 0; right < s.length; right++) {
    while (window.has(s[right])) {
      window.delete(s[left]);
      left++;
    }
    window.add(s[right]);
    best = Math.max(best, right - left + 1);
  }
  return best;
}
'''
go = '''
func longestUnique(s string) int {
    window := make(map[byte]bool)
    left := 0
    best := 0
    for right := 0; right < len(s); right++ {
        for window[s[right]] {
            delete(window, s[left])
            left++
        }
        window[s[right]] = true
        if right-left+1 > best {
            best = right - left + 1
        }
    }
    return best
}
'''

[[case]]
id = "monotonic_stack_next_greater"
title = "Next greater element with a monotonic stack"
tags = ["stack", "amortized", "trap", "while", "leetcode"]
time_class = "O(n)"
space_class = "O(n)"
time_expr = "O(n)"
space_expr = "O(n)"
rationale = "TRAP: a while inside a for looks O(n^2), but each index is pushed once and popped at most once, so total pops <= n. The result array and the stack are O(n)."

[case.sources]
python = '''
def next_greater(nums):
    result = [-1] * len(nums)
    stack = []
    for i in range(len(nums)):
        while stack and nums[stack[-1]] < nums[i]:
            result[stack.pop()] = nums[i]
        stack.append(i)
    return result
'''
cpp = '''
vector<int> nextGreater(vector<int>& nums) {
    vector<int> result(nums.size(), -1);
    stack<int> st;
    for (int i = 0; i < nums.size(); i++) {
        while (!st.empty() && nums[st.top()] < nums[i]) {
            result[st.top()] = nums[i];
            st.pop();
        }
        st.push(i);
    }
    return result;
}
'''
java = '''
class Solution {
    public int[] nextGreater(int[] nums) {
        int[] result = new int[nums.length];
        Arrays.fill(result, -1);
        Deque<Integer> stack = new ArrayDeque<>();
        for (int i = 0; i < nums.length; i++) {
            while (!stack.isEmpty() && nums[stack.peek()] < nums[i]) {
                result[stack.pop()] = nums[i];
            }
            stack.push(i);
        }
        return result;
    }
}
'''
javascript = '''
function nextGreater(nums) {
  const result = new Array(nums.length).fill(-1);
  const stack = [];
  for (let i = 0; i < nums.length; i++) {
    while (stack.length > 0 && nums[stack[stack.length - 1]] < nums[i]) {
      result[stack.pop()] = nums[i];
    }
    stack.push(i);
  }
  return result;
}
'''
go = '''
func nextGreater(nums []int) []int {
    result := make([]int, len(nums))
    for i := range result {
        result[i] = -1
    }
    stack := []int{}
    for i := 0; i < len(nums); i++ {
        for len(stack) > 0 && nums[stack[len(stack)-1]] < nums[i] {
            result[stack[len(stack)-1]] = nums[i]
            stack = stack[:len(stack)-1]
        }
        stack = append(stack, i)
    }
    return result
}
'''

[[case]]
id = "dutch_flag_partition"
title = "Sort colors with three pointers"
tags = ["two-pointers", "while", "leetcode", "in-place"]
time_class = "O(n)"
space_class = "O(1)"
time_expr = "O(n)"
space_expr = "O(1)"
rationale = "Each iteration either advances mid or retreats high, so high - mid shrinks by at least one every pass: at most n iterations."

[case.sources]
python = '''
def sort_colors(nums):
    low, mid, high = 0, 0, len(nums) - 1
    while mid <= high:
        if nums[mid] == 0:
            nums[low], nums[mid] = nums[mid], nums[low]
            low += 1
            mid += 1
        elif nums[mid] == 1:
            mid += 1
        else:
            nums[mid], nums[high] = nums[high], nums[mid]
            high -= 1
    return nums
'''
cpp = '''
void sortColors(vector<int>& nums) {
    int low = 0;
    int mid = 0;
    int high = nums.size() - 1;
    while (mid <= high) {
        if (nums[mid] == 0) {
            swap(nums[low], nums[mid]);
            low++;
            mid++;
        } else if (nums[mid] == 1) {
            mid++;
        } else {
            swap(nums[mid], nums[high]);
            high--;
        }
    }
}
'''
java = '''
class Solution {
    public void sortColors(int[] nums) {
        int low = 0;
        int mid = 0;
        int high = nums.length - 1;
        while (mid <= high) {
            if (nums[mid] == 0) {
                int t = nums[low];
                nums[low] = nums[mid];
                nums[mid] = t;
                low++;
                mid++;
            } else if (nums[mid] == 1) {
                mid++;
            } else {
                int t = nums[mid];
                nums[mid] = nums[high];
                nums[high] = t;
                high--;
            }
        }
    }
}
'''
javascript = '''
function sortColors(nums) {
  let low = 0;
  let mid = 0;
  let high = nums.length - 1;
  while (mid <= high) {
    if (nums[mid] === 0) {
      [nums[low], nums[mid]] = [nums[mid], nums[low]];
      low++;
      mid++;
    } else if (nums[mid] === 1) {
      mid++;
    } else {
      [nums[mid], nums[high]] = [nums[high], nums[mid]];
      high--;
    }
  }
}
'''
go = '''
func sortColors(nums []int) {
    low, mid, high := 0, 0, len(nums)-1
    for mid <= high {
        if nums[mid] == 0 {
            nums[low], nums[mid] = nums[mid], nums[low]
            low++
            mid++
        } else if nums[mid] == 1 {
            mid++
        } else {
            nums[mid], nums[high] = nums[high], nums[mid]
            high--
        }
    }
}
'''
c = '''
void sortColors(int* nums, int n) {
    int low = 0;
    int mid = 0;
    int high = n - 1;
    while (mid <= high) {
        if (nums[mid] == 0) {
            int t = nums[low];
            nums[low] = nums[mid];
            nums[mid] = t;
            low++;
            mid++;
        } else if (nums[mid] == 1) {
            mid++;
        } else {
            int t = nums[mid];
            nums[mid] = nums[high];
            nums[high] = t;
            high--;
        }
    }
}
'''

