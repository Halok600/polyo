    slow := head
    fast := head
    for fast != nil && fast.Next != nil {
        slow = slow.Next
        fast = fast.Next.Next
        if slow == fast {
            return true
        }
    }
    return false
}
'''

[[case]]
id = "expand_around_center_palindromes"
title = "Count palindromic substrings by expanding around centers"
tags = ["nested-loop", "while", "two-pointers", "trap", "leetcode"]
time_class = "O(n^2)"
space_class = "O(1)"
time_expr = "O(n^2)"
space_expr = "O(1)"
rationale = "TRAP in the other direction from the sliding window: l and r are RESET for every center, so nothing is amortised across centers. 2n-1 centers each expand up to n/2 steps: O(n^2)."

[case.sources]
python = '''
def count_palindromic_substrings(s):
    n = len(s)
    count = 0
    for center in range(2 * n - 1):
        l = center // 2
        r = l + center % 2
        while l >= 0 and r < n and s[l] == s[r]:
            count += 1
            l -= 1
            r += 1
    return count
'''
cpp = '''
int countPalindromicSubstrings(string& s) {
    int n = s.size();
    int count = 0;
    for (int center = 0; center < 2 * n - 1; center++) {
        int l = center / 2;
        int r = l + center % 2;
        while (l >= 0 && r < n && s[l] == s[r]) {
            count++;
            l--;
            r++;
        }
    }
    return count;
}
'''
java = '''
class Solution {
    public int countPalindromicSubstrings(String s) {
        int n = s.length();
        int count = 0;
        for (int center = 0; center < 2 * n - 1; center++) {
            int l = center / 2;
            int r = l + center % 2;
            while (l >= 0 && r < n && s.charAt(l) == s.charAt(r)) {
                count++;
                l--;
                r++;
            }
        }
        return count;
    }
}
'''
javascript = '''
function countPalindromicSubstrings(s) {
  const n = s.length;
  let count = 0;
  for (let center = 0; center < 2 * n - 1; center++) {
    let l = Math.floor(center / 2);
    let r = l + (center % 2);
    while (l >= 0 && r < n && s[l] === s[r]) {
      count++;
      l--;
      r++;
    }
  }
  return count;
}
'''
go = '''
func countPalindromicSubstrings(s string) int {
    n := len(s)
    count := 0
    for center := 0; center < 2*n-1; center++ {
        l := center / 2
        r := l + center%2
        for l >= 0 && r < n && s[l] == s[r] {
            count++
            l--
            r++
        }
    }
    return count
}
'''

