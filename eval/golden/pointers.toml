id = "branch_takes_worst_arm"
title = "Cheap branch versus nested-loop branch"
tags = ["branching", "nested-loop"]
time_class = "O(n^2)"
space_class = "O(1)"
time_expr = "O(n^2)"
space_expr = "O(1)"
rationale = "Worst-case analysis takes the more expensive arm of the if: the quadratic one, regardless of which mode is likely."

[case.sources]
python = '''
def process(nums, mode):
    if mode == 0:
        return sum(nums)
    total = 0
    for x in nums:
        for y in nums:
            total += x * y
    return total
'''
cpp = '''
long long process(vector<int>& nums, int mode) {
    long long total = 0;
    if (mode == 0) {
        for (int x : nums) total += x;
        return total;
    }
    for (int x : nums) {
        for (int y : nums) {
            total += (long long)x * y;
        }
    }
    return total;
}
'''
java = '''
class Solution {
    public long process(int[] nums, int mode) {
        long total = 0;
        if (mode == 0) {
            for (int x : nums) total += x;
            return total;
        }
        for (int x : nums) {
            for (int y : nums) {
                total += (long) x * y;
            }
        }
        return total;
    }
}
'''
javascript = '''
function process(nums, mode) {
  let total = 0;
  if (mode === 0) {
    for (const x of nums) total += x;
    return total;
  }
  for (const x of nums) {
    for (const y of nums) {
      total += x * y;
    }
  }
  return total;
}
'''
go = '''
func process(nums []int, mode int) int {
    total := 0
    if mode == 0 {
        for _, x := range nums {
            total += x
        }
        return total
    }
    for _, x := range nums {
        for _, y := range nums {
            total += x * y
        }
    }
    return total
}
'''

[[case]]
id = "sequential_phases_dominant_term"
title = "Three phases in sequence: n, then n squared, then n"
tags = ["sequential", "nested-loop"]
time_class = "O(n^2)"
space_class = "O(1)"
time_expr = "O(n^2)"
space_expr = "O(1)"
rationale = "Sequential blocks ADD, they do not multiply: n + n^2 + n = O(n^2)."

[case.sources]
python = '''
def phases(nums):
    total = 0
    for x in nums:
        total += x
    for x in nums:
        for y in nums:
            total += x * y
    for x in nums:
        total -= x
    return total
'''
cpp = '''
long long phases(vector<int>& nums) {
    long long total = 0;
    for (int x : nums) total += x;
    for (int x : nums) {
        for (int y : nums) {
            total += (long long)x * y;
        }
    }
    for (int x : nums) total -= x;
    return total;
}
'''
java = '''
class Solution {
    public long phases(int[] nums) {
        long total = 0;
        for (int x : nums) total += x;
        for (int x : nums) {
            for (int y : nums) {
                total += (long) x * y;
            }
        }
        for (int x : nums) total -= x;
        return total;
    }
}
'''
javascript = '''
function phases(nums) {
  let total = 0;
  for (const x of nums) total += x;
  for (const x of nums) {
    for (const y of nums) {
      total += x * y;
    }
  }
  for (const x of nums) total -= x;
  return total;
}
'''
go = '''
func phases(nums []int) int {
    total := 0
    for _, x := range nums {
        total += x
    }
    for _, x := range nums {
        for _, y := range nums {
            total += x * y
        }
    }
    for _, x := range nums {
        total -= x
    }
    return total
}
'''

[[case]]
id = "while_true_guard_break"
title = "while True with a guard break at the top"
tags = ["while", "break", "early-exit"]
time_class = "O(n)"
space_class = "O(1)"
time_expr = "O(n)"
space_expr = "O(1)"
rationale = "while True / if i >= n: break is just a loop with condition i < n; i advances by 1 each pass."

[case.sources]
python = '''
def sum_with_break(nums):
    i = 0
    total = 0
    while True:
        if i >= len(nums):
            break
        total += nums[i]
        i += 1
    return total
'''
cpp = '''
int sumWithBreak(vector<int>& nums) {
    int i = 0;
    int total = 0;
    while (true) {
        if (i >= nums.size()) break;
        total += nums[i];
        i++;
    }
    return total;
}
'''
java = '''
class Solution {
    public int sumWithBreak(int[] nums) {
        int i = 0;
        int total = 0;
        while (true) {
            if (i >= nums.length) break;
            total += nums[i];
            i++;
        }
        return total;
    }
}
'''
javascript = '''
function sumWithBreak(nums) {
  let i = 0;
  let total = 0;
  while (true) {
    if (i >= nums.length) break;
    total += nums[i];
    i++;
  }
  return total;
}
'''
go = '''
func sumWithBreak(nums []int) int {
    i := 0
    total := 0
    for {
        if i >= len(nums) {
            break
        }
        total += nums[i]
        i++
    }
    return total
}
'''
