# C++ -> IR mapping (tree-sitter-cpp grammar). See core/ir.py for the full IR
# symbol vocabulary and plan §5 for the design this implements, and
# python.toml for the schema this file follows.

[nodes]
function_definition = "FUNC_DEF"
return_statement = "RETURN"
compound_statement = "BLOCK"
for_statement = "LOOP_FOR"
for_range_loop = "LOOP_FOR"
while_statement = "LOOP_WHILE"
if_statement = "BRANCH"
break_statement = "BREAK"
continue_statement = "CONTINUE"
subscript_expression = "ARRAY_INDEX"
assignment_expression = "ASSIGN"
new_expression = "ARRAY_ALLOC"
identifier = "IDENT"
field_identifier = "IDENT"
number_literal = "LITERAL"
string_literal = "LITERAL"
true = "LITERAL"
false = "LITERAL"

[calls]
"^std::sort$" = "SORT"
"^std::(lower_bound|upper_bound|binary_search)$" = "BINARY_SEARCH"
"^(push_heap)$" = "HEAP_PUSH"
"^(pop_heap)$" = "HEAP_POP"
"^std::(min|max|abs|pow)$" = "MATH_OP"
"\\.push_back$" = "LIST_APPEND"
"\\.size$" = "MATH_OP"

# tree-sitter-cpp does not distinguish comparison from arithmetic by node
# type -- both parse as `binary_expression`/`update_expression`. These node
# types are resolved via the operator token instead of `[nodes]` (see
# `binary_operator_nodes` below); `[nodes]` above must NOT list them.
[binary_operator_nodes]
types = ["binary_expression", "update_expression"]

[binary_operator_map]
"==" = "COMPARE"
"!=" = "COMPARE"
"<" = "COMPARE"
"<=" = "COMPARE"
">" = "COMPARE"
">=" = "COMPARE"
"&&" = "COMPARE"
"||" = "COMPARE"
"+" = "ARITH"
"-" = "ARITH"
"*" = "ARITH"
"/" = "ARITH"
"%" = "ARITH"
"++" = "ARITH"
"--" = "ARITH"

[params]
container = "parameter_list"
leaf_types = ["parameter_declaration", "optional_parameter_declaration", "variadic_parameter_declaration"]
