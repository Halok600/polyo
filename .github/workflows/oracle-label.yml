name: Oracle -- multi-language labelling

# Manual-only: this runs untrusted-by-construction code (synthetic + scraped
# solutions) to auto-label training data. It never runs on a push/PR trigger
# and never touches the serving path. See plan SS0 -- this is the mitigation
# for this dev machine lacking gcc/java/go/docker: ubuntu-latest ships gcc
# already, and the actions below add Node, a JDK and Go.
on:
  workflow_dispatch:

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Confirm toolchains are present
        run: |
          gcc --version
          g++ --version
          node --version
          java -version
          go version
      - name: Install Python deps
        run: pip install -r requirements-dev.txt
      - name: Run multi-language oracle self-check
        run: pytest tests/test_oracle_self_check.py tests/test_oracle_self_check_multilang.py -v
      - name: Generate the synthetic corpus (labels are exact by construction, no oracle needed)
        run: python -m data.synth --out data/processed/synth.jsonl
