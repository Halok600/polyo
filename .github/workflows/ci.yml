name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy core api parsing features models oracle data eval analysis cli.py
      - name: Test
        run: pytest -q

  golden:
    # The safety net behind PolyO v2: hand-labelled cases in every language, perturbation
    # invariance, and the scorecard. Its own job so its status is not hidden by unrelated jobs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Golden suite, perturbations and regressions
        run: >
          pytest -q tests/test_golden_suite.py tests/test_golden_integrity.py
          tests/test_golden_perturbations.py tests/test_eval_perturb.py
          tests/test_eval_predictors.py tests/test_eval_scorecard.py
          tests/test_diagnosis_regressions.py tests/test_engine_golden.py
      - name: Golden regression ratchet
        run: python -m eval.golden_baseline
      - name: Scorecard
        run: python -m eval.scorecard --predictors rule,gnn,symbolic --out scorecard.md
      - name: Publish the scorecard to the run summary
        run: cat scorecard.md >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium
      - name: E2E smoke test
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build serving image
        run: docker build -t polyo-api:ci .
      - name: Enforce image size budget (300MB, see plan SS13)
        run: |
          size=$(docker image inspect polyo-api:ci --format='{{.Size}}')
          limit=$((300*1024*1024))
          echo "Image size: $size bytes (limit: $limit bytes)"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::Serving image exceeds the 300MB free-tier budget"
            exit 1
          fi
