name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy core api parsing features models oracle data eval cli.py
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build serving image
        run: docker build -t polyo-api:ci .
      - name: Enforce image size budget (300MB, see plan SS13)
        run: |
          size=$(docker image inspect polyo-api:ci --format='{{.Size}}')
          limit=$((300*1024*1024))
          echo "Image size: $size bytes (limit: $limit bytes)"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::Serving image exceeds the 300MB free-tier budget"
            exit 1
          fi
